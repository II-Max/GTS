<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO Online Judge — Sân Chơi Học Thuật Lập Trình</title>
    <meta name="description" content="NEO Online Judge - Hệ thống luyện tập và thi lập trình trực tuyến dành cho học sinh, sinh viên Việt Nam.">
    <link rel="stylesheet" href="css/neo-design.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Ambient glow blobs */
        .ambient {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
        }
        .ambient-1 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(79,142,247,0.08) 0%, transparent 70%);
            top: -100px; left: -100px;
        }
        .ambient-2 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(139,92,246,0.06) 0%, transparent 70%);
            bottom: -80px; right: -80px;
        }

        /* ── GATEWAY CONTAINER ── */
        .gateway {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            width: 100%;
            max-width: 520px;
            padding: 0 24px;
        }

        /* System label */
        .system-label {
            font-family: var(--font-code);
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .system-label::before, .system-label::after {
            content: '';
            width: 24px;
            height: 1px;
            background: var(--border-hover);
        }

        /* Main logo */
        .gateway-logo {
            font-family: var(--font-code);
            font-size: 3rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -1px;
            text-align: center;
            line-height: 1.1;
            margin-bottom: 8px;
        }
        .gateway-logo span {
            color: var(--accent);
        }

        .gateway-tagline {
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 40px;
            letter-spacing: 0.3px;
        }

        /* Status box */
        .status-box {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 14px 18px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-code);
            font-size: 0.82rem;
            color: var(--text-secondary);
            min-height: 50px;
        }

        .status-indicator {
            width: 8px; height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
            background: var(--text-muted);
        }
        .status-indicator.loading {
            background: var(--warning);
            animation: blink-status 1s ease-in-out infinite;
        }
        .status-indicator.online {
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
        }
        @keyframes blink-status {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* User info (when logged in) */
        .user-info-card {
            display: none;
            width: 100%;
            background: var(--success-dim);
            border: 1px solid var(--success-border);
            border-radius: var(--radius-md);
            padding: 14px 18px;
            margin-bottom: 20px;
            align-items: center;
            gap: 12px;
        }
        .user-info-card img {
            width: 40px; height: 40px;
            border-radius: 50%;
            border: 2px solid var(--success);
            object-fit: cover;
        }
        .user-info-card .user-name {
            font-weight: 600;
            font-size: 0.92rem;
            color: var(--text-primary);
        }
        .user-info-card .user-email {
            font-size: 0.76rem;
            color: var(--text-muted);
        }

        /* Auth buttons group */
        .auth-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .auth-btn {
            width: 100%;
            padding: 13px 20px;
            border-radius: var(--radius-md);
            font-family: var(--font-code);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            border: 1px solid;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.25s ease;
            text-decoration: none;
        }

        .auth-btn-google {
            background: transparent;
            color: #ea4335;
            border-color: rgba(234,67,53,0.4);
        }
        .auth-btn-google:hover {
            background: rgba(234,67,53,0.08);
            border-color: #ea4335;
            box-shadow: 0 0 20px rgba(234,67,53,0.15);
        }

        .auth-btn-primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .auth-btn-primary:hover {
            background: #6aa0f8;
            box-shadow: var(--shadow-glow);
            transform: translateY(-1px);
        }

        .auth-btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border-color: var(--border);
            font-size: 0.78rem;
        }
        .auth-btn-ghost:hover {
            color: var(--text-primary);
            border-color: var(--border-hover);
            background: rgba(255,255,255,0.04);
        }

        /* Quick links */
        .quick-links {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 28px;
        }
        .quick-links a {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            padding: 5px 12px;
            border: 1px solid var(--border);
            border-radius: 20px;
            transition: all 0.2s;
        }
        .quick-links a:hover {
            color: var(--accent);
            border-color: var(--accent-border);
        }

        /* Stats row */
        .platform-stats {
            display: flex;
            gap: 28px;
            margin-top: 36px;
            padding-top: 28px;
            border-top: 1px solid var(--border);
            width: 100%;
            justify-content: center;
        }
        .stat-item {
            text-align: center;
        }
        .stat-item .stat-num {
            font-family: var(--font-code);
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .stat-item .stat-label {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 2px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Spinner */
        .spinner-sm {
            width: 14px; height: 14px;
            border: 2px solid var(--border-hover);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin-sm 0.7s linear infinite;
        }
        @keyframes spin-sm { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="ambient ambient-1"></div>
    <div class="ambient ambient-2"></div>

    <div class="gateway">
        <!-- System label -->
        <div class="system-label">Academic Computing Platform</div>

        <!-- Logo -->
        <div class="gateway-logo">NEO<span>OJ</span></div>
        <div class="gateway-tagline">Hệ thống luyện tập & thi lập trình trực tuyến</div>

        <!-- Status box -->
        <div class="status-box" id="statusBox">
            <div class="status-indicator loading" id="statusDot"></div>
            <div class="spinner-sm" id="statusSpinner"></div>
            <span id="statusText">Đang kết nối hệ thống...</span>
        </div>

        <!-- User info (visible when logged in) -->
        <div class="user-info-card" id="userInfoCard">
            <img id="userAvatar" src="" alt="avatar">
            <div>
                <div class="user-name" id="userName">User</div>
                <div class="user-email" id="userEmail">user@email.com</div>
            </div>
        </div>

        <!-- Auth actions -->
        <div class="auth-group" id="authGroup">
            <button id="btnGoogle" class="auth-btn auth-btn-google" onclick="loginWithGoogle()">
                <i class="fab fa-google"></i> Đăng nhập với Google
            </button>
            <button id="btnLogin" class="auth-btn auth-btn-primary" onclick="goToLogin()">
                <i class="fas fa-right-to-bracket"></i> Tất cả phương thức đăng nhập
            </button>
        </div>

        <!-- Enter system (visible when logged in) -->
        <button id="btnStart" class="auth-btn auth-btn-primary" onclick="goToProblems()" style="display:none; width:100%;">
            <i class="fas fa-terminal"></i> Vào hệ thống
        </button>

        <!-- Quick links -->
        <div class="quick-links">
            <a href="login.html">Đăng nhập</a>
            <a href="login.html?tab=register">Đăng ký</a>
            <a href="problems.html">Bài tập</a>
            <a href="rank.html">Xếp hạng</a>
            <a href="about.html">Giới thiệu</a>
        </div>

        <!-- Platform stats -->
        <div class="platform-stats">
            <div class="stat-item">
                <div class="stat-num" id="statProblems">—</div>
                <div class="stat-label">Bài tập</div>
            </div>
            <div class="stat-item">
                <div class="stat-num" id="statUsers">—</div>
                <div class="stat-label">Thành viên</div>
            </div>
            <div class="stat-item">
                <div class="stat-num" id="statSubmissions">—</div>
                <div class="stat-label">Lượt nộp</div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="js/firebase-config.js"></script>
    <script>
        const statusDot  = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const statusSpinner = document.getElementById('statusSpinner');

        function setStatus(type, text) {
            statusText.textContent = text;
            statusDot.className = 'status-indicator ' + type;
            statusSpinner.style.display = type === 'loading' ? 'block' : 'none';
        }

        function goToLogin()    { window.location.href = 'login.html'; }
        function goToProblems() { window.location.href = 'problems.html'; }

        async function loginWithGoogle() {
            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                provider.setCustomParameters({ prompt: 'select_account' });
                const result = await auth.signInWithPopup(provider);
                const token = await result.user.getIdToken();
                try {
                    await fetch(API_BASE + '/auth/sync', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id_token: token })
                    });
                } catch (e) { /* backend optional */ }
                setTimeout(() => window.location.href = 'problems.html', 800);
            } catch (error) {
                if (error.code !== 'auth/popup-closed-by-user') {
                    setStatus('', 'Lỗi: ' + error.message);
                }
            }
        }

        // Load platform stats
        async function loadStats() {
            try {
                const response = await fetch(API_BASE + '/stats');
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('statProblems').textContent    = data.problems;
                    document.getElementById('statUsers').textContent       = data.users;
                    document.getElementById('statSubmissions').textContent = data.submissions;
                }
            } catch (e) { /* ignore */ }
        }

        auth.onAuthStateChanged(user => {
            if (user) {
                setStatus('online', 'Đã xác thực — Xin chào, ' + (user.displayName || user.email));
                document.getElementById('userInfoCard').style.display = 'flex';
                document.getElementById('userAvatar').src = user.photoURL
                    || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(user.displayName || user.email) + '&background=4f8ef7&color=fff';
                document.getElementById('userName').textContent  = user.displayName || 'User';
                document.getElementById('userEmail').textContent = user.email;

                document.getElementById('authGroup').style.display = 'none';
                document.getElementById('btnStart').style.display  = 'flex';

                localStorage.setItem('neo_user', JSON.stringify({
                    uid: user.uid, email: user.email,
                    display_name: user.displayName, avatar: user.photoURL,
                }));
            } else {
                setStatus('', 'Chọn phương thức đăng nhập để bắt đầu.');
                document.getElementById('userInfoCard').style.display = 'none';
                document.getElementById('authGroup').style.display    = 'flex';
                document.getElementById('btnStart').style.display     = 'none';
            }
        });

        loadStats();
    </script>
</body>
</html>
