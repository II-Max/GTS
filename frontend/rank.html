<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTS (Go to Success) — Bảng Xếp Hạng</title>
    <meta name="description" content="Bảng xếp hạng lập trình viên xuất sắc nhất hệ thống GTS (Go to Success).">
    <link rel="stylesheet" href="css/neo-design.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { padding-bottom: 60px; }

        .main { max-width: 800px; margin: 0 auto; padding: 32px 20px; }

        /* ── Page header ── */
        .rank-hero {
            text-align: center;
            margin-bottom: 36px;
        }

        .rank-title {
            font-family: var(--font-code);
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 6px;
        }

        .rank-title i { color: var(--gold); }

        .rank-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* ── Rank list ── */
        .rank-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }

        .rank-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            transition: background 0.15s;
            position: relative;
        }
        .rank-item:last-child { border-bottom: none; }
        .rank-item:hover { background: rgba(255,255,255,0.02); }

        /* Top 3 highlight */
        .rank-item.top-1 {
            background: linear-gradient(90deg, rgba(245,158,11,0.08), transparent);
            border-left: 3px solid var(--gold);
        }
        .rank-item.top-2 {
            background: linear-gradient(90deg, rgba(148,163,184,0.06), transparent);
            border-left: 3px solid #94a3b8;
        }
        .rank-item.top-3 {
            background: linear-gradient(90deg, rgba(205,127,50,0.06), transparent);
            border-left: 3px solid #cd7f32;
        }

        /* Position number */
        .r-pos {
            width: 44px;
            font-family: var(--font-code);
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text-muted);
            text-align: center;
            flex-shrink: 0;
        }
        .top-1 .r-pos { color: var(--gold); }
        .top-2 .r-pos { color: #94a3b8; }
        .top-3 .r-pos { color: #cd7f32; }

        /* Position emoji for top 3 */
        .r-emoji {
            display: none;
            font-size: 1.1rem;
        }
        .top-1 .r-pos-num { display: none; }
        .top-1 .r-emoji { display: block; }
        .top-2 .r-pos-num { display: none; }
        .top-2 .r-emoji { display: block; }
        .top-3 .r-pos-num { display: none; }
        .top-3 .r-emoji { display: block; }

        /* Avatar */
        .r-avatar {
            width: 42px; height: 42px;
            border-radius: 50%;
            border: 2px solid var(--border);
            object-fit: cover;
            flex-shrink: 0;
        }
        .top-1 .r-avatar { border-color: var(--gold); box-shadow: 0 0 12px rgba(245,158,11,0.3); }
        .top-2 .r-avatar { border-color: #94a3b8; }
        .top-3 .r-avatar { border-color: #cd7f32; }

        /* Name & info */
        .r-info { flex: 1; }
        .r-name {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-primary);
            margin-bottom: 2px;
        }
        .r-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: var(--font-code);
        }

        /* Score */
        .r-score-col { text-align: right; }
        .r-score {
            font-family: var(--font-code);
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--accent);
        }
        .top-1 .r-score { color: var(--gold); }
        .r-solved {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* ── Current user highlight ── */
        .rank-item.me {
            background: var(--accent-dim) !important;
            border-left: 3px solid var(--accent);
        }

        /* Empty / loading state */
        .rank-empty {
            padding: 48px;
            text-align: center;
            color: var(--text-muted);
        }
        .rank-empty i { font-size: 2rem; display: block; margin-bottom: 12px; }

        /* ── Skeleton loading ── */
        .rank-skeleton {
            padding: 18px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            display: flex;
            align-items: center;
            gap: 16px;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="neo-nav">
        <a class="neo-nav-brand" href="index.html">
            <span class="brand-dot"></span>GTS
        </a>
        <div class="neo-nav-links">
            <a href="problems.html">Bài tập</a>
            <a href="about.html">Giới thiệu</a>
            <a href="documents.html">Tài liệu</a>
            <a href="videos.html">Video</a>
            <a href="contest.html">Phòng thi</a>
            <a href="history.html">Lịch sử</a>
            <a href="rank.html" class="active">Xếp hạng</a>
        </div>
    </nav>

    <div class="main">
        <!-- Hero -->
        <div class="rank-hero">
            <div class="rank-title">
                <i class="fa-solid fa-trophy"></i> Hall of Fame
            </div>
            <div class="rank-subtitle">Bảng vinh danh lập trình viên xuất sắc nhất hệ thống</div>
        </div>

        <!-- Rank list -->
        <div class="rank-card" id="rank-list">
            <!-- Skeleton loading -->
            <div class="rank-skeleton">
                <div class="skeleton" style="width:44px;height:20px;"></div>
                <div class="skeleton" style="width:42px;height:42px;border-radius:50%;"></div>
                <div style="flex:1">
                    <div class="skeleton" style="width:60%;height:14px;margin-bottom:6px;"></div>
                    <div class="skeleton" style="width:40%;height:10px;"></div>
                </div>
                <div class="skeleton" style="width:60px;height:18px;"></div>
            </div>
            <div class="rank-skeleton">
                <div class="skeleton" style="width:44px;height:20px;"></div>
                <div class="skeleton" style="width:42px;height:42px;border-radius:50%;"></div>
                <div style="flex:1">
                    <div class="skeleton" style="width:55%;height:14px;margin-bottom:6px;"></div>
                    <div class="skeleton" style="width:35%;height:10px;"></div>
                </div>
                <div class="skeleton" style="width:60px;height:18px;"></div>
            </div>
            <div class="rank-skeleton" style="border-bottom:none;">
                <div class="skeleton" style="width:44px;height:20px;"></div>
                <div class="skeleton" style="width:42px;height:42px;border-radius:50%;"></div>
                <div style="flex:1">
                    <div class="skeleton" style="width:65%;height:14px;margin-bottom:6px;"></div>
                    <div class="skeleton" style="width:30%;height:10px;"></div>
                </div>
                <div class="skeleton" style="width:60px;height:18px;"></div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="js/firebase-config.js"></script>
    <script>
        let currentUid = null;

        auth.onAuthStateChanged(user => {
            if (user) currentUid = user.uid;
            loadRank();
        });

        async function loadRank() {
            const listDiv = document.getElementById('rank-list');

            try {
                // Doc tu public_leaderboard — node nay chi chua ten + diem, an toan 100%
                const snap = await db.ref('public_leaderboard').once('value');

                if (!snap.exists()) {
                    listDiv.innerHTML = `
                        <div class="rank-empty">
                            <i class="fa-solid fa-chart-bar"></i>
                            Chưa có dữ liệu xếp hạng. Hãy nộp bài đầu tiên!
                        </div>`;
                    return;
                }

                const data = snap.val();

                const rankArray = Object.entries(data).map(([uid, u]) => ({
                    uid,
                    name: u.display_name || 'Ẩn danh',
                    avatar: u.avatar || '',
                    total: u.score || 0,
                    solvedCount: u.problems_solved || 0,
                })).sort((a, b) => b.total !== a.total ? b.total - a.total : b.solvedCount - a.solvedCount);

                if (rankArray.length === 0) {
                    listDiv.innerHTML = `<div class="rank-empty"><i class="fa-solid fa-chart-bar"></i>Chưa có dữ liệu.</div>`;
                    return;
                }

                const medals = ['🥇', '🥈', '🥉'];

                listDiv.innerHTML = rankArray.slice(0, 50).map((u, idx) => {
                    const rank     = idx + 1;
                    const topClass = rank <= 3 ? `top-${rank}` : '';
                    const meClass  = u.uid === currentUid ? 'me' : '';
                    const avatarUrl = u.avatar
                        || `https://ui-avatars.com/api/?name=${encodeURIComponent(u.name)}&background=4f8ef7&color=fff&size=42`;

                    return `
                        <div class="rank-item ${topClass} ${meClass}">
                            <div class="r-pos">
                                <span class="r-pos-num">#${rank}</span>
                                <span class="r-emoji">${medals[idx] || ''}</span>
                            </div>
                            <img class="r-avatar" src="${avatarUrl}" alt="${u.name}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(u.name)}&background=4f8ef7&color=fff&size=42'">
                            <div class="r-info">
                                <div class="r-name">${u.name}${u.uid === currentUid ? ' <span style="font-size:0.7rem;color:var(--accent)">(bạn)</span>' : ''}</div>
                                <div class="r-sub">${u.solvedCount} bài AC</div>
                            </div>
                            <div class="r-score-col">
                                <div class="r-score">${u.total} PTS</div>
                                <div class="r-solved">${u.solvedCount} hoàn thành</div>
                            </div>
                        </div>`;
                }).join('');

            } catch (err) {
                console.error('Lỗi tải rank:', err);
                listDiv.innerHTML = `
                    <div class="rank-empty">
                        <i class="fa-solid fa-triangle-exclamation" style="color:var(--danger)"></i>
                        Lỗi tải dữ liệu: ${err.message}
                    </div>`;
            }
        }
    </script>
</body>
</html>
