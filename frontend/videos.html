<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTS (Go to Success) — Video Bài Giảng</title>
    <meta name="description" content="Kho video hướng dẫn giải bài tập lập trình — GTS (Go to Success).">
    <link rel="stylesheet" href="css/neo-design.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { padding-bottom: 80px; }
        .main { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }

        /* ── User bar ── */
        .user-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 16px 20px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .user-bar-ava {
            width: 48px; height: 48px;
            border-radius: 50%;
            border: 2px solid var(--accent-border);
            object-fit: cover;
            flex-shrink: 0;
        }
        .user-bar-info { flex: 1; min-width: 0; }
        .user-bar-name { font-weight: 700; color: var(--text-primary); font-size: 0.95rem; }
        .user-bar-stats {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .user-bar-stat {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .user-bar-stat b { color: var(--text-secondary); }
        .user-bar-right {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: auto;
        }
        .progress-mini { margin-top: 6px; }
        .progress-track { height: 3px; background: var(--bg-elevated); border-radius: 2px; overflow: hidden; width: 120px; }
        .progress-fill  { height: 100%; background: var(--success); border-radius: 2px; transition: width 0.4s; }

        /* ── Page header ── */
        .page-header-row {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
        }
        .page-header-row h2 {
            font-family: var(--font-code); font-size: 1.1rem; font-weight: 700;
            color: var(--text-primary); display: flex; align-items: center; gap: 10px; margin: 0;
        }
        .page-header-row h2 i { color: #ef4444; }

        /* ── Video grid ── */
        .grid-vid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }
        .vid-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
            transition: all 0.25s;
        }
        .vid-card:hover {
            border-color: rgba(239,68,68,0.4);
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(239,68,68,0.1);
        }
        .vid-frame {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            display: block;
            border: none;
        }
        .vid-info { padding: 14px 16px; }
        .vid-title {
            font-weight: 700;
            color: var(--text-primary);
            font-size: 0.88rem;
            margin-bottom: 6px;
            font-family: var(--font-code);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .vid-desc {
            color: var(--text-muted);
            font-size: 0.78rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.5;
        }
        .vid-empty {
            grid-column: 1/-1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .vid-empty i { font-size: 2.5rem; display: block; margin-bottom: 12px; color: var(--border-hover); }

        /* ── Add modal form ── */
        .modal-form-group { margin-bottom: 14px; }
        .modal-form-label { display: block; font-size: 0.72rem; color: var(--text-muted); margin-bottom: 5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }
        .modal-input, .modal-textarea {
            width: 100%;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            padding: 9px 12px;
            font-family: var(--font-code);
            font-size: 0.83rem;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }
        .modal-input:focus { border-color: var(--accent-border); }

        @media (max-width: 640px) { .grid-vid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="neo-nav">
        <a class="neo-nav-brand" href="index.html">
            <span class="brand-dot"></span>GTS
        </a>
        <div class="neo-nav-links">
            <a href="problems.html">Bài tập</a>
            <a href="about.html">Giới thiệu</a>
            <a href="documents.html">Tài liệu</a>
            <a href="videos.html" class="active">Video</a>
            <a href="contest.html">Phòng thi</a>
            <a href="history.html">Lịch sử</a>
            <a href="rank.html">Xếp hạng</a>
        </div>
    </nav>

    <div class="main">

        <!-- User bar -->
        <div class="user-bar">
            <img id="d-ava" class="user-bar-ava" src="" alt="Avatar">
            <div class="user-bar-info">
                <div class="user-bar-name" id="d-name">Đang tải...</div>
                <div class="user-bar-stats">
                    <div class="user-bar-stat"><i class="fa-solid fa-trophy" style="color:var(--gold)"></i> <b id="d-score">0</b> điểm</div>
                    <div class="user-bar-stat"><i class="fa-solid fa-ranking-star" style="color:var(--accent)"></i> <b id="d-rank">#--</b></div>
                    <div class="user-bar-stat"><i class="fa-solid fa-circle-check" style="color:var(--success)"></i> <b id="s-done">0</b> hoàn thành</div>
                    <div class="user-bar-stat"><i class="fa-solid fa-xmark" style="color:var(--danger)"></i> <b id="s-wrong">0</b> sai</div>
                </div>
                <div class="progress-mini">
                    <div style="font-size:0.65rem;color:var(--text-muted);margin-bottom:3px;" id="progress-label">Tiến độ: 0 / 50</div>
                    <div class="progress-track"><div class="progress-fill" id="progress-bar" style="width:0%"></div></div>
                </div>
            </div>
            <div class="user-bar-right">
                <span id="role-display" class="badge role-student"><i class="fa-solid fa-graduation-cap"></i> Học sinh</span>
                <button onclick="logout()" class="btn btn-ghost btn-sm"><i class="fa-solid fa-power-off"></i></button>
            </div>
        </div>

        <!-- Page header -->
        <div class="page-header-row">
            <h2><i class="fa-brands fa-youtube"></i> Kho Video Hướng Dẫn</h2>
            <button id="btn-add-vid" class="btn btn-outline btn-sm" onclick="openModal()" style="display:none;">
                <i class="fa-solid fa-plus"></i> Thêm video
            </button>
        </div>

        <!-- Video grid -->
        <div class="grid-vid" id="vid-list">
            <div class="vid-empty"><i class="fa-solid fa-circle-notch fa-spin"></i> Đang tải danh sách video...</div>
        </div>
    </div>

    <!-- Add Video Modal -->
    <div id="modal-add" class="neo-modal-overlay">
        <div class="neo-modal">
            <div class="neo-modal-header">
                <div class="neo-modal-title"><i class="fa-brands fa-youtube" style="color:#ef4444"></i> Thêm Video Mới</div>
                <button class="neo-modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="neo-modal-body">
                <div class="modal-form-group">
                    <label class="modal-form-label">Tiêu đề Video</label>
                    <input type="text" id="v-title" class="modal-input" placeholder="VD: Hướng dẫn giải bài Fibonacci...">
                </div>
                <div class="modal-form-group">
                    <label class="modal-form-label">YouTube Video ID</label>
                    <input type="text" id="v-id" class="modal-input" placeholder="VD: dQw4w9WgXcQ (chỉ nhập phần ID)">
                </div>
                <div class="modal-form-group">
                    <label class="modal-form-label">Mô tả ngắn</label>
                    <input type="text" id="v-desc" class="modal-input" placeholder="Mô tả nội dung bài giảng...">
                </div>
                <button class="btn btn-primary btn-full" onclick="saveVideo()" style="margin-top:8px;">
                    <i class="fa-solid fa-floppy-disk"></i> Đăng Video
                </button>
            </div>
        </div>
    </div>

    <div class="neo-toast-container" id="toast-container"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="js/firebase-config.js"></script>
    <script>
        let currentUser = null;

        /* ── Auth ── */
        auth.onAuthStateChanged(user => {
            if (!user) { window.location.href = 'login.html?redirect=videos.html'; return; }
            currentUser = user;

            const name = encodeURIComponent(user.displayName || user.email || 'U');
            document.getElementById('d-ava').src = user.photoURL
                || `https://ui-avatars.com/api/?name=${name}&background=4f8ef7&color=fff&size=96`;
            document.getElementById('d-name').textContent = user.displayName || user.email || 'User';

            checkRole();
            loadStatsAndRank();
            loadVideos();
        });

        function checkRole() {
            db.ref('users/' + currentUser.uid).on('value', snap => {
                const role = snap.val()?.role || 'student';
                const el   = document.getElementById('role-display');
                const btn  = document.getElementById('btn-add-vid');
                if (role === 'teacher') {
                    el.className = 'badge role-teacher';
                    el.innerHTML = '<i class="fa-solid fa-chalkboard-user"></i> Giáo viên';
                    btn.style.display = 'inline-flex';
                } else {
                    el.className = 'badge role-student';
                    el.innerHTML = '<i class="fa-solid fa-graduation-cap"></i> Học sinh';
                    btn.style.display = 'none';
                }
            });
        }

        function loadStatsAndRank() {
            db.ref('submissions').on('value', snap => {
                const data = snap.val();
                if (!data) return;

                const allUserScores = {};
                Object.values(data).forEach(s => {
                    if (s.status !== 'completed') return;
                    if (!allUserScores[s.uid]) allUserScores[s.uid] = {};
                    const score = parseInt(s.score) || 0;
                    if (!allUserScores[s.uid][s.problem_id] || score > allUserScores[s.uid][s.problem_id])
                        allUserScores[s.uid][s.problem_id] = score;
                });

                const myScores = allUserScores[currentUser.uid] || {};
                let myTotal = 0, cDone = 0, cWrong = 0;
                Object.values(myScores).forEach(sc => {
                    myTotal += sc;
                    if (sc === 100) cDone++; else if (sc === 0) cWrong++;
                });

                document.getElementById('d-score').textContent  = myTotal;
                document.getElementById('s-done').textContent   = cDone;
                document.getElementById('s-wrong').textContent  = cWrong;

                const TOTAL = 50;
                const pct   = Math.min(Math.round((cDone / TOTAL) * 100), 100);
                document.getElementById('progress-label').textContent = `Tiến độ: ${cDone} / ${TOTAL} bài`;
                document.getElementById('progress-bar').style.width   = pct + '%';

                const rankList = Object.keys(allUserScores).map(uid => {
                    let t = 0; Object.values(allUserScores[uid]).forEach(sc => t += sc);
                    return { uid, total: t };
                }).sort((a, b) => b.total - a.total);

                const me = rankList.find(u => u.uid === currentUser.uid);
                if (me) document.getElementById('d-rank').textContent = '#' + (rankList.indexOf(me) + 1);
            });
        }

        /* ── Load Videos ── */
        function loadVideos() {
            db.ref('videos').on('value', snap => {
                const data = snap.val();
                const div  = document.getElementById('vid-list');
                if (!data) {
                    div.innerHTML = `<div class="vid-empty"><i class="fa-brands fa-youtube"></i><strong>Chưa có video nào</strong><p>Giáo viên có thể thêm video bài giảng.</p></div>`;
                    return;
                }
                div.innerHTML = '';
                // Reverse để video mới nhất lên đầu
                Object.values(data).reverse().forEach(vid => {
                    const el = document.createElement('div');
                    el.className = 'vid-card';
                    el.innerHTML = `
                        <iframe class="vid-frame"
                            src="https://www.youtube.com/embed/${esc(vid.youtube_id)}"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                            allowfullscreen loading="lazy"></iframe>
                        <div class="vid-info">
                            <div class="vid-title">${esc(vid.title)}</div>
                            ${vid.desc ? `<div class="vid-desc">${esc(vid.desc)}</div>` : ''}
                        </div>`;
                    div.appendChild(el);
                });
            });
        }

        function saveVideo() {
            const title = document.getElementById('v-title').value.trim();
            const ytid  = document.getElementById('v-id').value.trim();
            const desc  = document.getElementById('v-desc').value.trim();
            if (!title || !ytid) { showToast('Vui lòng nhập Tiêu đề và YouTube ID!', 'error'); return; }
            db.ref('videos').push({
                title, youtube_id: ytid, desc,
                author: currentUser.email,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            })
            .then(() => { closeModal(); showToast('Thêm video thành công!', 'success'); })
            .catch(e  => showToast('Lỗi: ' + e.message, 'error'));
        }

        /* ── Modal ── */
        function openModal()  { document.getElementById('modal-add').classList.add('open'); }
        function closeModal() { document.getElementById('modal-add').classList.remove('open'); }
        document.getElementById('modal-add').addEventListener('click', e => {
            if (e.target === document.getElementById('modal-add')) closeModal();
        });

        /* ── Utils ── */
        function esc(str) {
            if (!str) return '';
            return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
        }

        function showToast(msg, type = 'info') {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            const icons = { success: 'fa-circle-check', error: 'fa-circle-xmark', info: 'fa-circle-info' };
            t.className = `neo-toast ${type}`;
            t.innerHTML = `<i class="fa-solid ${icons[type]||'fa-circle-info'}"></i> ${esc(msg)}`;
            c.appendChild(t);
            setTimeout(() => { t.style.opacity='0'; t.style.transform='translateX(20px)'; t.style.transition='all 0.3s'; setTimeout(()=>t.remove(),300); }, 3500);
        }

        function logout() { auth.signOut().then(() => window.location.href = 'login.html'); }
    </script>
</body>
</html>
