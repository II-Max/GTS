<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTS (Go to Success) — Lịch Sử Nộp Bài</title>
    <meta name="description" content="Xem lại lịch sử các lần nộp bài của bạn.">
    <link rel="stylesheet" href="css/neo-design.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { padding-bottom: 60px; }
        .main { max-width: 1000px; margin: 0 auto; padding: 32px 20px; }

        /* ── Filter bar ── */
        .filter-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-chip {
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            font-family: var(--font-code);
            transition: all 0.2s;
        }
        .filter-chip:hover { border-color: var(--border-hover); color: var(--text-primary); }
        .filter-chip.active { background: var(--accent-dim); border-color: var(--accent-border); color: var(--accent); }
        .filter-chip.contest.active { background: var(--gold-dim); border-color: var(--warning-border); color: var(--gold); }

        /* ── Table ── */
        .prob-link {
            color: var(--text-primary);
            font-weight: 600;
            text-decoration: none;
        }
        .prob-link:hover { color: var(--accent); }

        .lang-badge {
            font-family: var(--font-code);
            font-size: 0.75rem;
            color: var(--text-code);
            text-transform: uppercase;
        }

        /* Score badges */
        .score-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 4px 10px;
            border-radius: 4px;
            font-family: var(--font-code);
            font-size: 0.82rem;
            font-weight: 700;
            min-width: 44px;
        }
        .score-ac      { background: var(--success-dim); color: var(--success); border: 1px solid var(--success-border); }
        .score-partial { background: var(--warning-dim); color: var(--warning); border: 1px solid var(--warning-border); }
        .score-wa      { background: var(--danger-dim);  color: var(--danger);  border: 1px solid var(--danger-border); }
        .score-pending { background: rgba(148,163,184,0.1); color: var(--text-muted); border: 1px solid var(--border); }

        /* Type tag */
        .type-practice { color: var(--text-muted); font-family: var(--font-code); font-size: 0.7rem; }
        .type-contest  { color: var(--gold);  font-family: var(--font-code); font-size: 0.7rem; }

        /* Empty */
        .table-empty { padding: 48px; text-align: center; color: var(--text-muted); }
        .table-empty i { font-size: 2rem; display: block; margin-bottom: 12px; }

        /* ── Code modal ── */
        .code-modal-wrap {
            background: var(--bg-card);
            border: 1px solid var(--border-hover);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 820px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            animation: modal-in 0.2s ease;
        }
        @keyframes modal-in {
            from { opacity: 0; transform: scale(0.97) translateY(-8px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        .code-modal-header {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .code-modal-title {
            font-family: var(--font-code);
            font-size: 0.85rem;
            color: var(--text-code);
            font-weight: 600;
        }

        .code-view-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #0d1117;
            color: #c9d1d9;
            font-family: var(--font-code);
            font-size: 0.85rem;
            white-space: pre;
            line-height: 1.6;
            margin: 0;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="neo-nav">
        <a class="neo-nav-brand" href="index.html">
            <span class="brand-dot"></span>GTS
        </a>
        <div class="neo-nav-links">
            <a href="problems.html">Bài tập</a>
            <a href="about.html">Giới thiệu</a>
            <a href="documents.html">Tài liệu</a>
            <a href="videos.html">Video</a>
            <a href="contest.html">Phòng thi</a>
            <a href="history.html" class="active">Lịch sử</a>
            <a href="rank.html">Xếp hạng</a>
        </div>
    </nav>

    <div class="main">
        <div class="page-header">
            <div class="page-title">
                <i class="fa-solid fa-clock-rotate-left"></i> Nhật ký nộp bài
            </div>
            <div class="page-subtitle">Xem lại lịch sử tất cả các lần nộp bài của bạn</div>
        </div>

        <!-- Filter -->
        <div class="filter-bar">
            <button class="filter-chip active"    id="chip-all"     onclick="setFilter('all')">Tất cả</button>
            <button class="filter-chip"           id="chip-practice" onclick="setFilter('practice')">
                <i class="fa-solid fa-dumbbell"></i> Luyện tập
            </button>
            <button class="filter-chip contest"   id="chip-contest" onclick="setFilter('contest')">
                <i class="fa-solid fa-trophy"></i> Phòng thi
            </button>
        </div>

        <!-- Table -->
        <div class="neo-table-wrap">
            <table class="neo-table">
                <thead>
                    <tr>
                        <th width="17%">Thời gian</th>
                        <th width="35%">Bài toán</th>
                        <th width="14%">Ngôn ngữ</th>
                        <th width="16%">Điểm</th>
                        <th width="18%" style="text-align:right">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="hist-list">
                    <tr>
                        <td colspan="5" class="table-empty">
                            <div style="width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:btn-spin 0.7s linear infinite;margin:0 auto 10px;"></div>
                            Đang tải dữ liệu...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Code view modal -->
    <div id="modal-code" class="neo-modal-overlay">
        <div class="code-modal-wrap">
            <div class="code-modal-header">
                <div class="code-modal-title">
                    <i class="fa-solid fa-code"></i> <span id="modal-code-label">Source Code</span>
                </div>
                <button class="neo-modal-close" onclick="closeModal()">×</button>
            </div>
            <pre id="code-content" class="code-view-area"></pre>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="js/firebase-config.js"></script>
    <script>
        let currentUser  = null;
        let allHistory   = [];
        let activeFilter = 'all';

        auth.onAuthStateChanged(user => {
            if (!user) { window.location.href = 'login.html?redirect=history.html'; return; }
            currentUser = user;
            loadHistory();
        });

        async function loadHistory() {
            const tbody = document.getElementById('hist-list');

            try {
                const [snap1, snap2] = await Promise.all([
                    db.ref('submissions').orderByChild('uid').equalTo(currentUser.uid).once('value'),
                    db.ref('contest_submissions').orderByChild('uid').equalTo(currentUser.uid).once('value'),
                ]);

                allHistory = [];

                if (snap1.exists()) {
                    Object.entries(snap1.val()).forEach(([key, val]) => {
                        allHistory.push({ ...val, _id: key, type: 'practice' });
                    });
                }
                if (snap2.exists()) {
                    Object.entries(snap2.val()).forEach(([key, val]) => {
                        allHistory.push({ ...val, _id: key, type: 'contest' });
                    });
                }

                allHistory.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                renderHistory();

            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="5" class="table-empty" style="color:var(--danger)">Lỗi: ${err.message}</td></tr>`;
            }
        }

        function setFilter(f) {
            activeFilter = f;
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            document.getElementById('chip-' + f).classList.add('active');
            renderHistory();
        }

        function renderHistory() {
            const tbody = document.getElementById('hist-list');
            const filtered = activeFilter === 'all'
                ? allHistory
                : allHistory.filter(h => h.type === activeFilter);

            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr><td colspan="5">
                        <div class="table-empty">
                            <i class="fa-solid fa-inbox"></i>
                            ${activeFilter === 'all' ? 'Bạn chưa nộp bài nào.' : 'Không có lần nộp nào ở mục này.'}
                        </div>
                    </td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(item => {
                const date = item.timestamp
                    ? new Date(item.timestamp).toLocaleString('vi-VN', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' })
                    : '—';

                const score = item.score !== undefined ? parseInt(item.score) : null;
                let scoreHtml;
                if (score === null || isNaN(score)) {
                    scoreHtml = `<span class="score-badge score-pending">Pending</span>`;
                } else if (score === 100) {
                    scoreHtml = `<span class="score-badge score-ac">100 ✓</span>`;
                } else if (score > 0) {
                    scoreHtml = `<span class="score-badge score-partial">${score}</span>`;
                } else {
                    scoreHtml = `<span class="score-badge score-wa">0</span>`;
                }

                const typeHtml = item.type === 'contest'
                    ? `<span class="type-contest"><i class="fa-solid fa-trophy"></i> THI</span>`
                    : `<span class="type-practice"><i class="fa-solid fa-dumbbell"></i> TẬP</span>`;

                // Store code in data attribute (safe)
                return `
                    <tr data-id="${item._id}">
                        <td style="font-size:0.8rem;color:var(--text-muted)">${date}</td>
                        <td>
                            <div style="display:flex;align-items:center;gap:8px;">
                                ${typeHtml}
                                <a href="solve.html?id=${item.problem_id}" class="prob-link">${item.problem_id || '—'}</a>
                            </div>
                        </td>
                        <td><span class="lang-badge">${item.language || '—'}</span></td>
                        <td>${scoreHtml}</td>
                        <td style="text-align:right;">
                            <button class="btn btn-ghost btn-sm" onclick="viewCode('${item._id}', '${(item.language||'').toUpperCase()}')">
                                <i class="fa-regular fa-eye"></i> Xem code
                            </button>
                        </td>
                    </tr>`;
            }).join('');

            // Attach code data to rows (avoids URI encoding issues)
            filtered.forEach(item => {
                const row = tbody.querySelector(`tr[data-id="${item._id}"]`);
                if (row) row._code = item.code || '(Không có code)';
            });
        }

        function viewCode(id, lang) {
            const tbody = document.getElementById('hist-list');
            const row   = tbody.querySelector(`tr[data-id="${id}"]`);
            const code  = row ? row._code : '(Không có code)';

            document.getElementById('modal-code-label').textContent = `Source Code — ${lang || ''}`;
            document.getElementById('code-content').textContent = code;
            document.getElementById('modal-code').classList.add('open');
        }

        function closeModal() {
            document.getElementById('modal-code').classList.remove('open');
        }

        document.getElementById('modal-code').addEventListener('click', e => {
            if (e.target === document.getElementById('modal-code')) closeModal();
        });
    </script>
</body>
</html>
