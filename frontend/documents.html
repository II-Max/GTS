<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTS (Go to Success) — Thư Viện Tài Liệu</title>
    <meta name="description" content="Kho tài liệu học lập trình — GTS (Go to Success).">
    <link rel="stylesheet" href="css/neo-design.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { padding-bottom: 80px; }
        .main { max-width: 1000px; margin: 0 auto; padding: 32px 24px; }

        /* ── User bar ── */
        .user-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 16px 20px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .user-bar-ava {
            width: 48px; height: 48px;
            border-radius: 50%;
            border: 2px solid var(--accent-border);
            object-fit: cover;
            flex-shrink: 0;
        }
        .user-bar-info { flex: 1; min-width: 0; }
        .user-bar-name { font-weight: 700; color: var(--text-primary); font-size: 0.95rem; }
        .user-bar-stats {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .user-bar-stat {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .user-bar-stat b { color: var(--text-secondary); }
        .user-bar-right {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: auto;
        }

        /* ── Progress bar mini ── */
        .progress-mini { margin-top: 6px; }
        .progress-track {
            height: 3px;
            background: var(--bg-elevated);
            border-radius: 2px;
            overflow: hidden;
            width: 120px;
        }
        .progress-fill {
            height: 100%;
            background: var(--success);
            border-radius: 2px;
            transition: width 0.4s;
        }

        /* ── Page header ── */
        .page-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .page-header-row h2 {
            font-family: var(--font-code);
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0;
        }
        .page-header-row h2 i { color: var(--accent); }

        /* ── Doc list ── */
        .doc-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 18px 20px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            transition: all 0.2s;
        }
        .doc-item:hover {
            border-color: var(--accent-border);
            transform: translateX(4px);
            box-shadow: 0 4px 20px rgba(79,142,247,0.08);
        }
        .doc-left { display: flex; align-items: center; gap: 16px; flex: 1; min-width: 0; }
        .doc-icon {
            width: 44px; height: 44px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            flex-shrink: 0;
        }
        .doc-icon.pdf  { background: rgba(239,68,68,0.1);  color: #ef4444; }
        .doc-icon.doc  { background: rgba(79,142,247,0.1); color: var(--accent); }
        .doc-icon.xls  { background: rgba(16,185,129,0.1); color: var(--success); }
        .doc-icon.ppt  { background: rgba(245,158,11,0.1); color: var(--warning); }
        .doc-icon.file { background: var(--bg-elevated);   color: var(--text-muted); }
        .doc-title {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .doc-meta {
            font-size: 0.72rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 3px;
            flex-wrap: wrap;
        }
        .doc-type-badge {
            font-family: var(--font-code);
            font-size: 0.65rem;
            padding: 2px 7px;
            border-radius: 3px;
            border: 1px solid var(--border);
            background: var(--bg-elevated);
            color: var(--text-muted);
            text-transform: uppercase;
        }
        .doc-desc {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .doc-empty {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-muted);
        }
        .doc-empty i { font-size: 2.5rem; display: block; margin-bottom: 12px; color: var(--border-hover); }

        /* ── Doc viewer ── */
        #doc-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.97);
            z-index: 9999;
            display: none;
            flex-direction: column;
        }
        .doc-modal-header {
            height: 56px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            gap: 12px;
            flex-shrink: 0;
        }
        .doc-modal-title {
            font-family: var(--font-code);
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .doc-modal-body { flex: 1; background: #000; }
        .doc-modal-body iframe { width: 100%; height: 100%; border: none; display: block; }

        /* ── Add modal ── */
        .modal-form-group { margin-bottom: 14px; }
        .modal-form-label { display: block; font-size: 0.72rem; color: var(--text-muted); margin-bottom: 5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }
        .modal-input, .modal-textarea, .modal-select {
            width: 100%;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            padding: 9px 12px;
            font-family: var(--font-code);
            font-size: 0.83rem;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }
        .modal-input:focus, .modal-select:focus { border-color: var(--accent-border); }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="neo-nav">
        <a class="neo-nav-brand" href="index.html">
            <span class="brand-dot"></span>GTS
        </a>
        <div class="neo-nav-links">
            <a href="problems.html">Bài tập</a>
            <a href="about.html">Giới thiệu</a>
            <a href="documents.html" class="active">Tài liệu</a>
            <a href="videos.html">Video</a>
            <a href="contest.html">Phòng thi</a>
            <a href="history.html">Lịch sử</a>
            <a href="rank.html">Xếp hạng</a>
            <a href="playground.html">Thử Nghiệm</a>
        </div>
    </nav>

    <div class="main">

        <!-- User bar -->
        <div class="user-bar">
            <img id="d-ava" class="user-bar-ava" src="" alt="Avatar">
            <div class="user-bar-info">
                <div class="user-bar-name" id="d-name">Đang tải...</div>
                <div class="user-bar-stats">
                    <div class="user-bar-stat"><i class="fa-solid fa-trophy" style="color:var(--gold)"></i> <b id="d-score">0</b> điểm</div>
                    <div class="user-bar-stat"><i class="fa-solid fa-ranking-star" style="color:var(--accent)"></i> <b id="d-rank">#--</b></div>
                    <div class="user-bar-stat"><i class="fa-solid fa-circle-check" style="color:var(--success)"></i> <b id="s-done">0</b> hoàn thành</div>
                    <div class="user-bar-stat"><i class="fa-solid fa-xmark" style="color:var(--danger)"></i> <b id="s-wrong">0</b> sai</div>
                </div>
                <div class="progress-mini">
                    <div style="font-size:0.65rem;color:var(--text-muted);margin-bottom:3px;" id="progress-label">Tiến độ: 0 / 50</div>
                    <div class="progress-track"><div class="progress-fill" id="progress-bar" style="width:0%"></div></div>
                </div>
            </div>
            <div class="user-bar-right">
                <span id="role-display" class="badge role-student"><i class="fa-solid fa-graduation-cap"></i> Học sinh</span>
                <button onclick="logout()" class="btn btn-ghost btn-sm"><i class="fa-solid fa-power-off"></i></button>
            </div>
        </div>

        <!-- Page header -->
        <div class="page-header-row">
            <h2><i class="fa-solid fa-folder-open"></i> Thư Viện Tài Liệu Số</h2>
            <button id="btn-add-doc" class="btn btn-outline btn-sm" onclick="openAddModal()" style="display:none;">
                <i class="fa-solid fa-cloud-arrow-up"></i> Upload tài liệu
            </button>
        </div>

        <!-- Doc list -->
        <div id="doc-list">
            <div class="doc-empty"><i class="fa-solid fa-circle-notch fa-spin"></i> Đang tải dữ liệu...</div>
        </div>
    </div>

    <!-- Add Document Modal -->
    <div id="modal-add" class="neo-modal-overlay">
        <div class="neo-modal">
            <div class="neo-modal-header">
                <div class="neo-modal-title"><i class="fa-solid fa-cloud-arrow-up"></i> Upload Tài Liệu</div>
                <button class="neo-modal-close" onclick="closeAddModal()">×</button>
            </div>
            <div class="neo-modal-body">
                <div class="modal-form-group">
                    <label class="modal-form-label">Tên tài liệu</label>
                    <input type="text" id="t-title" class="modal-input" placeholder="VD: Đề cương Tin học...">
                </div>
                <div class="modal-form-group">
                    <label class="modal-form-label">Link (Google Drive / PDF URL)</label>
                    <input type="text" id="t-url" class="modal-input" placeholder="https://...">
                </div>
                <div class="modal-form-group">
                    <label class="modal-form-label">Loại file</label>
                    <select id="t-type" class="modal-select">
                        <option value="PDF">PDF</option>
                        <option value="DOCX">Word (DOC/DOCX)</option>
                        <option value="PPTX">PowerPoint (PPT/PPTX)</option>
                        <option value="XLSX">Excel</option>
                    </select>
                </div>
                <div class="modal-form-group">
                    <label class="modal-form-label">Mô tả ngắn</label>
                    <input type="text" id="t-desc" class="modal-input" placeholder="Mô tả nội dung...">
                </div>
                <button class="btn btn-primary btn-full" onclick="saveDoc()" style="margin-top:8px;">
                    <i class="fa-solid fa-floppy-disk"></i> Lưu tài liệu
                </button>
            </div>
        </div>
    </div>

    <!-- Document viewer -->
    <div id="doc-modal">
        <div class="doc-modal-header">
            <span class="doc-modal-title" id="modal-doc-title">Document Viewer</span>
            <div style="display:flex;gap:12px;align-items:center;flex-shrink:0;">
                <a id="btn-open-new" href="#" target="_blank" class="btn btn-outline btn-sm">
                    <i class="fa-solid fa-up-right-from-square"></i> Mở tab mới
                </a>
                <button class="btn btn-ghost btn-sm" onclick="closeDocViewer()">
                    <i class="fa-solid fa-xmark"></i> Đóng
                </button>
            </div>
        </div>
        <div class="doc-modal-body">
            <iframe id="doc-frame" src=""></iframe>
        </div>
    </div>

    <div class="neo-toast-container" id="toast-container"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="js/firebase-config.js"></script>
    <script>
        let currentUser = null;
        let currentRole = 'student';

        /* ── Auth ── */
        auth.onAuthStateChanged(user => {
            if (!user) { window.location.href = 'login.html?redirect=documents.html'; return; }
            currentUser = user;

            const name = encodeURIComponent(user.displayName || user.email || 'U');
            document.getElementById('d-ava').src = user.photoURL
                || `https://ui-avatars.com/api/?name=${name}&background=4f8ef7&color=fff&size=96`;
            document.getElementById('d-name').textContent = user.displayName || user.email || 'User';

            checkRole();
            loadStatsAndRank();
            loadDocs();
        });

        function checkRole() {
            db.ref('users/' + currentUser.uid).on('value', snap => {
                const role = snap.val()?.role || 'student';
                currentRole = role;
                const el  = document.getElementById('role-display');
                const btn = document.getElementById('btn-add-doc');
                if (role === 'teacher') {
                    el.className = 'badge role-teacher';
                    el.innerHTML = '<i class="fa-solid fa-chalkboard-user"></i> Giáo viên';
                    btn.style.display = 'inline-flex';
                } else {
                    el.className = 'badge role-student';
                    el.innerHTML = '<i class="fa-solid fa-graduation-cap"></i> Học sinh';
                    btn.style.display = 'none';
                }
            });
        }

        function loadStatsAndRank() {
            db.ref('submissions').on('value', snap => {
                const data = snap.val();
                if (!data) return;

                const allUserScores = {};
                Object.values(data).forEach(s => {
                    if (s.status !== 'completed') return;
                    if (!allUserScores[s.uid]) allUserScores[s.uid] = {};
                    const score = parseInt(s.score) || 0;
                    if (!allUserScores[s.uid][s.problem_id] || score > allUserScores[s.uid][s.problem_id])
                        allUserScores[s.uid][s.problem_id] = score;
                });

                const myScores = allUserScores[currentUser.uid] || {};
                let myTotal = 0, cDone = 0, cWrong = 0;
                Object.values(myScores).forEach(sc => {
                    myTotal += sc;
                    if (sc === 100) cDone++; else if (sc === 0) cWrong++;
                });

                document.getElementById('d-score').textContent  = myTotal;
                document.getElementById('s-done').textContent   = cDone;
                document.getElementById('s-wrong').textContent  = cWrong;

                // Progress bar (50 bài)
                const TOTAL = 50;
                const pct   = Math.min(Math.round((cDone / TOTAL) * 100), 100);
                document.getElementById('progress-label').textContent = `Tiến độ: ${cDone} / ${TOTAL} bài`;
                document.getElementById('progress-bar').style.width   = pct + '%';

                // Rank
                const rankList = Object.keys(allUserScores).map(uid => {
                    let t = 0; Object.values(allUserScores[uid]).forEach(sc => t += sc);
                    return { uid, total: t };
                }).sort((a, b) => b.total - a.total);

                const me = rankList.find(u => u.uid === currentUser.uid);
                if (me) document.getElementById('d-rank').textContent = '#' + (rankList.indexOf(me) + 1);
            });
        }

        /* ── Load Docs ── */
        function loadDocs() {
            db.ref('documents').on('value', snap => {
                const data = snap.val();
                const div  = document.getElementById('doc-list');
                if (!data) {
                    div.innerHTML = `<div class="doc-empty"><i class="fa-solid fa-folder-open"></i><strong>Chưa có tài liệu nào</strong><p>Giáo viên có thể upload tài liệu mới.</p></div>`;
                    return;
                }
                div.innerHTML = '';
                Object.entries(data).reverse().forEach(([key, doc]) => {
                    const type = (doc.type || '').toUpperCase();
                    let iconClass = 'file', icon = 'fa-file';
                    if (type === 'PDF')               { iconClass = 'pdf'; icon = 'fa-file-pdf'; }
                    else if (type.includes('DOC'))    { iconClass = 'doc'; icon = 'fa-file-word'; }
                    else if (type.includes('XLS'))    { iconClass = 'xls'; icon = 'fa-file-excel'; }
                    else if (type.includes('PPT'))    { iconClass = 'ppt'; icon = 'fa-file-powerpoint'; }

                    const el = document.createElement('div');
                    el.className = 'doc-item';
                    el.innerHTML = `
                        <div class="doc-left">
                            <div class="doc-icon ${iconClass}"><i class="fa-solid ${icon}"></i></div>
                            <div style="min-width:0;flex:1">
                                <div class="doc-title">${esc(doc.title)}</div>
                                <div class="doc-meta">
                                    <span class="doc-type-badge">${esc(type)}</span>
                                    <span>${esc(doc.date || '')}</span>
                                    ${doc.author ? '<span>' + esc(doc.author) + '</span>' : ''}
                                </div>
                                ${doc.desc ? `<div class="doc-desc">${esc(doc.desc)}</div>` : ''}
                            </div>
                        </div>
                        <button class="btn btn-outline btn-sm" onclick="viewDocument('${esc(doc.url)}','${esc(type)}','${esc(doc.title)}')">
                            <i class="fa-regular fa-eye"></i> Xem
                        </button>`;
                    div.appendChild(el);
                });
            });
        }

        function saveDoc() {
            const title = document.getElementById('t-title').value.trim();
            const url   = document.getElementById('t-url').value.trim();
            const type  = document.getElementById('t-type').value;
            const desc  = document.getElementById('t-desc').value.trim();
            if (!title || !url) { showToast('Vui lòng nhập Tên và Link tài liệu!', 'error'); return; }
            const dateStr = new Date().toLocaleDateString('vi-VN');
            db.ref('documents').push({ title, url, type, desc, date: dateStr, author: currentUser.email })
                .then(() => { closeAddModal(); showToast('Upload tài liệu thành công!', 'success'); })
                .catch(e => showToast('Lỗi (Chỉ giáo viên): ' + e.message, 'error'));
        }

        function viewDocument(url, type, title) {
            document.getElementById('modal-doc-title').textContent = title;
            document.getElementById('btn-open-new').href = url;
            let src = url;
            if (url.includes('drive.google.com')) {
                src = url.replace('/view', '/preview').replace('/edit', '/preview');
                if (!src.includes('/preview') && !src.includes('export=')) src += '/preview';
            } else if (['DOC','DOCX','XLS','XLSX','PPT','PPTX'].includes(type.toUpperCase())) {
                src = `https://docs.google.com/gview?url=${encodeURIComponent(url)}&embedded=true`;
            }
            document.getElementById('doc-frame').src = src;
            document.getElementById('doc-modal').style.display = 'flex';
        }

        function closeDocViewer() {
            document.getElementById('doc-modal').style.display = 'none';
            document.getElementById('doc-frame').src = '';
        }

        /* ── Modal ── */
        function openAddModal()  { document.getElementById('modal-add').classList.add('open'); }
        function closeAddModal() { document.getElementById('modal-add').classList.remove('open'); }
        document.getElementById('modal-add').addEventListener('click', e => {
            if (e.target === document.getElementById('modal-add')) closeAddModal();
        });

        /* ── Utils ── */
        function esc(str) {
            if (!str) return '';
            return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
        }

        function showToast(msg, type = 'info') {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            const icons = { success: 'fa-circle-check', error: 'fa-circle-xmark', info: 'fa-circle-info' };
            t.className = `neo-toast ${type}`;
            t.innerHTML = `<i class="fa-solid ${icons[type]||'fa-circle-info'}"></i> ${esc(msg)}`;
            c.appendChild(t);
            setTimeout(() => { t.style.opacity='0'; t.style.transform='translateX(20px)'; t.style.transition='all 0.3s'; setTimeout(()=>t.remove(),300); }, 3500);
        }

        function logout() { auth.signOut().then(() => window.location.href = 'login.html'); }
    </script>
</body>
</html>
