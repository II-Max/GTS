<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO Online Judge — Kho Bài Tập</title>
    <meta name="description" content="Luyện tập lập trình với kho bài tập phong phú từ Easy đến Hard.">
    <link rel="stylesheet" href="css/neo-design.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { padding-bottom: 60px; }

        .main { max-width: 1200px; margin: 0 auto; padding: 28px 24px; }

        /* ── Dashboard ── */
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            gap: 20px;
            margin-bottom: 32px;
        }

        .dash-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 22px;
            transition: border-color 0.2s;
        }
        .dash-card:hover { border-color: var(--border-hover); }

        .dash-card.accent-blue { border-left: 3px solid var(--accent); }
        .dash-card.accent-gold { border-left: 3px solid var(--gold); }
        .dash-card.accent-green { border-left: 3px solid var(--success); }

        /* Profile card */
        .profile-row {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .profile-avatar {
            width: 64px; height: 64px;
            border-radius: 50%;
            border: 2px solid var(--accent-border);
            object-fit: cover;
            flex-shrink: 0;
        }
        .profile-name {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        /* Stats card */
        .stats-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 100%;
        }
        .stat-box { text-align: center; }
        .stat-num {
            font-family: var(--font-code);
            font-size: 2.4rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 4px;
        }
        .stat-gold  { color: var(--gold); }
        .stat-blue  { color: var(--accent); }
        .stat-label { font-size: 0.78rem; color: var(--text-muted); }

        /* Chart card */
        .chart-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 100%;
        }
        .chart-wrap { width: 100px; height: 100px; position: relative; }
        .chart-legend { display: flex; flex-direction: column; gap: 8px; }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.78rem;
            font-family: var(--font-code);
            color: var(--text-secondary);
        }
        .legend-dot {
            width: 8px; height: 8px;
            border-radius: 2px;
            flex-shrink: 0;
        }

        /* ── Toolbar ── */
        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            position: relative;
        }
        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .search-box input {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            padding: 10px 12px 10px 36px;
            font-family: var(--font-ui);
            font-size: 0.88rem;
            outline: none;
            transition: all 0.2s;
        }
        .search-box input:focus {
            border-color: var(--accent-border);
            background: var(--bg-input);
            box-shadow: 0 0 0 3px rgba(79,142,247,0.1);
        }
        .search-box input::placeholder { color: var(--text-muted); }

        /* Filter buttons */
        .filter-group {
            display: flex;
            gap: 6px;
        }
        .filter-btn {
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.78rem;
            font-weight: 600;
            font-family: var(--font-code);
            cursor: pointer;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            transition: all 0.2s;
            letter-spacing: 0.3px;
        }
        .filter-btn:hover { border-color: var(--border-hover); color: var(--text-primary); }
        .filter-btn.active { border-color: var(--accent-border); color: var(--accent); background: var(--accent-dim); }
        .filter-btn.easy.active   { border-color: var(--success-border); color: var(--success); background: var(--success-dim); }
        .filter-btn.medium.active { border-color: var(--warning-border); color: var(--warning); background: var(--warning-dim); }
        .filter-btn.hard.active   { border-color: var(--danger-border);  color: var(--danger);  background: var(--danger-dim); }

        /* Action buttons */
        .action-btns { display: flex; gap: 8px; }

        /* ── Problem Grid ── */
        .problems-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .problem-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 18px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            font-family: var(--font-code);
        }
        .problem-card:hover {
            border-color: var(--accent-border);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(79,142,247,0.1);
        }
        .problem-card.done {
            border-color: var(--success-border);
        }
        .problem-card.done:hover {
            border-color: var(--success);
            box-shadow: 0 4px 20px rgba(16,185,129,0.1);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        .card-id {
            font-size: 0.7rem;
            color: var(--text-muted);
            background: var(--bg-elevated);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid var(--border);
        }
        .card-done-mark {
            color: var(--success);
            font-size: 1rem;
            display: none;
        }
        .problem-card.done .card-done-mark { display: block; }

        .card-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
            line-height: 1.4;
        }

        .card-desc {
            font-size: 0.78rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: var(--font-ui);
            margin-bottom: 12px;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* ── Add Problem Modal ── */
        .modal-form-group { margin-bottom: 14px; }
        .modal-form-label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }
        .modal-input, .modal-textarea, .modal-select {
            width: 100%;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            padding: 10px 12px;
            font-family: var(--font-code);
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .modal-input:focus, .modal-textarea:focus, .modal-select:focus {
            border-color: var(--accent-border);
        }
        .modal-textarea { resize: vertical; }

        /* ── Chat ── */
        #chat-toggle {
            position: fixed;
            bottom: 28px;
            left: 28px;
            background: var(--bg-card);
            color: var(--accent);
            border: 1px solid var(--accent-border);
            padding: 10px 18px;
            border-radius: 24px;
            font-weight: 600;
            cursor: pointer;
            z-index: 998;
            font-family: var(--font-code);
            font-size: 0.8rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #chat-toggle:hover {
            background: var(--accent-dim);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        #chat-box {
            position: fixed;
            bottom: 80px;
            left: 28px;
            width: 360px;
            height: 440px;
            background: var(--bg-card);
            border: 1px solid var(--accent-border);
            border-radius: var(--radius-lg);
            display: none;
            flex-direction: column;
            z-index: 999;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
        }

        .chat-header {
            padding: 14px 16px;
            background: var(--accent-dim);
            border-bottom: 1px solid var(--accent-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-code);
            font-size: 0.82rem;
            color: var(--accent);
            font-weight: 700;
        }

        .chat-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            transition: color 0.2s;
        }
        .chat-close:hover { color: var(--text-primary); }

        .chat-messages {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            font-size: 0.82rem;
            color: var(--text-secondary);
        }

        .chat-msg {
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            padding-bottom: 8px;
        }

        .chat-msg-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3px;
        }

        .chat-input-row {
            display: flex;
            border-top: 1px solid var(--border);
            background: var(--bg-surface);
        }
        .chat-input-row input {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-primary);
            padding: 10px 12px;
            font-size: 0.85rem;
            outline: none;
        }
        .chat-input-row button {
            background: var(--accent);
            border: none;
            color: #fff;
            padding: 0 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .chat-input-row button:hover { background: #6aa0f8; }

        /* Empty state */
        .empty-state {
            grid-column: 1/-1;
            text-align: center;
            padding: 48px;
            color: var(--text-muted);
        }
        .empty-state i { font-size: 2rem; margin-bottom: 12px; display: block; }

        /* Section header */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .section-title {
            font-family: var(--font-code);
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .problem-count {
            font-size: 0.75rem;
            color: var(--text-muted);
            background: var(--bg-elevated);
            padding: 2px 8px;
            border-radius: 10px;
        }

        @media (max-width: 900px) {
            .dashboard { grid-template-columns: 1fr; gap: 12px; }
            #chat-box { width: calc(100vw - 40px); left: 20px; }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="neo-nav">
        <a class="neo-nav-brand" href="index.html">
            <span class="brand-dot"></span>NEO<span style="color:var(--text-secondary)">OJ</span>
        </a>
        <div class="neo-nav-links">
            <a href="problems.html" class="active">Bài tập</a>
            <a href="about.html">Giới thiệu</a>
            <a href="documents.html">Tài liệu</a>
            <a href="videos.html">Video</a>
            <a href="contest.html">Phòng thi</a>
            <a href="history.html">Lịch sử</a>
            <a href="rank.html">Xếp hạng</a>
        </div>
    </nav>

    <div class="main">

        <!-- Dashboard -->
        <div class="dashboard">
            <!-- Profile card -->
            <div class="dash-card accent-blue">
                <div class="profile-row">
                    <img id="d-ava" class="profile-avatar" src="" alt="Avatar">
                    <div>
                        <div class="profile-name" id="d-name">Đang tải...</div>
                        <span id="role-display" class="badge role-student">Học sinh</span>
                        <div style="margin-top:10px;">
                            <button onclick="logout()" class="btn btn-ghost btn-sm">
                                <i class="fa-solid fa-power-off"></i> Đăng xuất
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Stats card -->
            <div class="dash-card accent-gold">
                <div class="stats-row">
                    <div class="stat-box">
                        <div class="stat-num stat-gold" id="d-score">0</div>
                        <div class="stat-label"><i class="fa-solid fa-bolt" style="color:var(--gold)"></i> Tổng điểm</div>
                    </div>
                    <div style="width:1px; height:40px; background:var(--border);"></div>
                    <div class="stat-box">
                        <div class="stat-num stat-blue" id="d-rank">—</div>
                        <div class="stat-label"><i class="fa-solid fa-earth-asia" style="color:var(--accent)"></i> Hạng</div>
                    </div>
                </div>
            </div>

            <!-- Chart card -->
            <div class="dash-card accent-green">
                <div class="chart-row">
                    <div class="chart-wrap">
                        <canvas id="myChart"></canvas>
                    </div>
                    <div class="chart-legend">
                        <div class="legend-item">
                            <span class="legend-dot" style="background:var(--success)"></span>
                            <span>Hoàn thành: <b id="s-done" style="color:var(--text-primary)">0</b></span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-dot" style="background:var(--warning)"></span>
                            <span>Chưa xong: <b id="s-partial" style="color:var(--text-primary)">0</b></span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-dot" style="background:var(--danger)"></span>
                            <span>Sai/Lỗi: <b id="s-wrong" style="color:var(--text-primary)">0</b></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="Tìm kiếm bài tập..." onkeyup="handleSearch()">
            </div>
            <div class="filter-group">
                <button class="filter-btn active" id="filter-all"    onclick="setFilter('all')">Tất cả</button>
                <button class="filter-btn easy"   id="filter-easy"   onclick="setFilter('Easy')">Dễ</button>
                <button class="filter-btn medium" id="filter-medium" onclick="setFilter('Medium')">TB</button>
                <button class="filter-btn hard"   id="filter-hard"   onclick="setFilter('Hard')">Khó</button>
            </div>
            <div class="action-btns">
                <button id="btn-add-prob" class="btn btn-ghost btn-sm" onclick="openModal()" style="display:none;">
                    <i class="fa-solid fa-plus"></i> Thêm bài
                </button>
                <button class="btn btn-outline btn-sm" onclick="handleRandom()">
                    <i class="fa-solid fa-dice"></i> Random
                </button>
            </div>
        </div>

        <!-- Problem list -->
        <div class="section-header">
            <div class="section-title">
                <i class="fa-solid fa-list-check"></i> Kho bài tập
                <span class="problem-count" id="problem-count">0 bài</span>
            </div>
        </div>

        <div class="problems-grid" id="problem-list">
            <div class="empty-state">
                <div style="width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:btn-spin 0.7s linear infinite;margin:0 auto 12px;"></div>
                Đang tải dữ liệu...
            </div>
        </div>
    </div>

    <!-- Add Problem Modal -->
    <div id="modal-add" class="neo-modal-overlay">
        <div class="neo-modal" style="max-width:600px;">
            <div class="neo-modal-header">
                <div class="neo-modal-title"><i class="fa-solid fa-pen-to-square"></i> Thêm bài tập mới</div>
                <button class="neo-modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="neo-modal-body">
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                    <div class="modal-form-group">
                        <label class="modal-form-label">Mã bài (ID)</label>
                        <input type="text" id="p-id" class="modal-input" placeholder="VD: bai01">
                    </div>
                    <div class="modal-form-group">
                        <label class="modal-form-label">Độ khó</label>
                        <select id="p-level" class="modal-select">
                            <option value="Easy">Dễ (Easy)</option>
                            <option value="Medium">Trung bình (Medium)</option>
                            <option value="Hard">Khó (Hard)</option>
                        </select>
                    </div>
                </div>
                <div class="modal-form-group">
                    <label class="modal-form-label">Tên bài tập</label>
                    <input type="text" id="p-title" class="modal-input">
                </div>
                <div class="modal-form-group">
                    <label class="modal-form-label">Mô tả đề bài</label>
                    <textarea id="p-desc" class="modal-textarea" rows="4"></textarea>
                </div>
                <div class="modal-form-group">
                    <label class="modal-form-label">YouTube ID (tùy chọn)</label>
                    <input type="text" id="p-vid" class="modal-input" placeholder="dQw4w9WgXcQ">
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                    <div class="modal-form-group">
                        <label class="modal-form-label">Input mẫu</label>
                        <textarea id="p-in" class="modal-textarea" rows="2"></textarea>
                    </div>
                    <div class="modal-form-group">
                        <label class="modal-form-label">Output mẫu</label>
                        <textarea id="p-out" class="modal-textarea" rows="2"></textarea>
                    </div>
                </div>
                <div class="modal-form-group">
                    <label class="modal-form-label" style="color:var(--warning)">Test cases (JSON)</label>
                    <textarea id="p-tests" class="modal-textarea" rows="3" placeholder='[{"input": "1 2", "output": "3"}]'></textarea>
                </div>
                <button class="btn btn-primary btn-full" onclick="saveProblem()" style="margin-top:8px;">
                    <i class="fa-solid fa-floppy-disk"></i> Lưu bài tập
                </button>
            </div>
        </div>
    </div>

    <!-- Chat -->
    <button id="chat-toggle" onclick="toggleChat()">
        <i class="fa-solid fa-comments"></i> Chat
    </button>
    <div id="chat-box">
        <div class="chat-header">
            <span><i class="fa-solid fa-earth-americas"></i> Kênh chat chung</span>
            <button class="chat-close" onclick="toggleChat()">×</button>
        </div>
        <div id="chat-messages" class="chat-messages"></div>
        <div class="chat-input-row">
            <input type="text" id="chat-input" placeholder="Nhập tin nhắn..." onkeypress="handleEnter(event)">
            <button onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-auth-check.js"></script>
    <script>
        let currentUser     = null;
        let currentUserRole = 'student';
        let globalProblems  = [];
        let userSolvedIds   = new Set();
        let chartInstance   = null;
        let activeFilter    = 'all';

        auth.onAuthStateChanged(user => {
            if (!user) { window.location.href = 'login.html'; return; }
            currentUser = user;
            document.getElementById('d-name').textContent = user.displayName || user.email || 'User';
            const name = encodeURIComponent(user.displayName || user.email || 'U');
            document.getElementById('d-ava').src = user.photoURL
                || `https://ui-avatars.com/api/?name=${name}&background=4f8ef7&color=fff&size=64`;
            checkAndInitUserRole();
            loadProblems();
            loadChat();
        });

        function checkAndInitUserRole() {
            db.ref('users/' + currentUser.uid).on('value', snap => {
                const data = snap.val();
                if (!data) {
                    db.ref('users/' + currentUser.uid).set({
                        email: currentUser.email,
                        name: currentUser.displayName,
                        role: 'student'
                    });
                    currentUserRole = 'student';
                } else {
                    currentUserRole = data.role || 'student';
                }
                updateRoleUI(currentUserRole);
            });
        }

        function updateRoleUI(role) {
            const el = document.getElementById('role-display');
            const btnAdd = document.getElementById('btn-add-prob');
            if (role === 'teacher') {
                el.className = 'badge role-teacher';
                el.innerHTML = '<i class="fa-solid fa-chalkboard-user"></i> Giáo viên';
                btnAdd.style.display = 'inline-flex';
            } else {
                el.className = 'badge role-student';
                el.innerHTML = '<i class="fa-solid fa-graduation-cap"></i> Học sinh';
                btnAdd.style.display = 'none';
            }
        }

        function loadProblems() {
            db.ref('problems').on('value', snap => {
                const data = snap.val();
                globalProblems = [];
                if (data) Object.keys(data).forEach(key => globalProblems.push({ id: key, ...data[key] }));
                calculateStatsAndRender();
            });
        }

        function getFilteredList() {
            const keyword = document.getElementById('search-input').value.toLowerCase();
            return globalProblems.filter(p => {
                const matchSearch = !keyword || p.title.toLowerCase().includes(keyword) || p.id.toLowerCase().includes(keyword);
                const matchFilter = activeFilter === 'all' || p.level === activeFilter;
                return matchSearch && matchFilter;
            });
        }

        function renderProblemList(list) {
            const div = document.getElementById('problem-list');
            document.getElementById('problem-count').textContent = list.length + ' bài';
            if (list.length === 0) {
                div.innerHTML = `<div class="empty-state"><i class="fa-solid fa-inbox"></i>Không tìm thấy bài tập nào.</div>`;
                return;
            }
            div.innerHTML = list.map(bai => {
                const isDone    = userSolvedIds.has(bai.id);
                const levelMap  = { Easy: 'badge-easy', Medium: 'badge-medium', Hard: 'badge-hard' };
                const levelText = { Easy: 'Dễ', Medium: 'Trung bình', Hard: 'Khó' };
                return `
                    <div class="problem-card ${isDone ? 'done' : ''}" onclick="location.href='solve.html?id=${bai.id}'">
                        <div class="card-top">
                            <span class="card-id">${bai.id}</span>
                            <i class="fa-solid fa-circle-check card-done-mark"></i>
                        </div>
                        <div class="card-title">${bai.title}</div>
                        <div class="card-desc">${bai.description || ''}</div>
                        <div class="card-footer">
                            <span class="badge ${levelMap[bai.level] || 'badge-accent'}">${levelText[bai.level] || bai.level || '—'}</span>
                        </div>
                    </div>`;
            }).join('');
        }

        function calculateStatsAndRender() {
            db.ref('submissions').on('value', snap => {
                const data = snap.val();
                if (!data) { renderProblemList(getFilteredList()); updateDashboard(0, 0, 0, globalProblems.length); return; }

                const allUserScores = {};
                Object.values(data).forEach(s => {
                    if (s.status !== 'completed') return;
                    if (!allUserScores[s.uid]) allUserScores[s.uid] = {};
                    const score = parseInt(s.score);
                    if (!allUserScores[s.uid][s.problem_id] || score > allUserScores[s.uid][s.problem_id]) {
                        allUserScores[s.uid][s.problem_id] = score;
                    }
                });

                const myScores = allUserScores[currentUser.uid] || {};
                userSolvedIds.clear();
                let cDone = 0, cPartial = 0, cWrong = 0, cTodo = 0, myTotal = 0;

                globalProblems.forEach(p => {
                    const sc = myScores[p.id];
                    if (sc === undefined)  { cTodo++; }
                    else if (sc === 100)   { cDone++;    userSolvedIds.add(p.id); myTotal += 100; }
                    else if (sc === 0)     { cWrong++; }
                    else                   { cPartial++; myTotal += sc; }
                });

                updateDashboard(cDone, cPartial, cWrong, cTodo);
                document.getElementById('d-score').textContent = myTotal;
                renderProblemList(getFilteredList());

                const rankList = Object.keys(allUserScores).map(uid => {
                    let total = 0;
                    Object.values(allUserScores[uid]).forEach(sc => total += sc);
                    return { uid, total };
                }).sort((a, b) => b.total - a.total);

                const me = rankList.find(u => u.uid === currentUser.uid);
                if (me) document.getElementById('d-rank').textContent = '#' + (rankList.indexOf(me) + 1);
            });
        }

        function updateDashboard(done, partial, wrong, todo) {
            document.getElementById('s-done').textContent    = done;
            document.getElementById('s-partial').textContent = partial;
            document.getElementById('s-wrong').textContent   = wrong;

            const ctx   = document.getElementById('myChart').getContext('2d');
            const total = done + partial + wrong + todo;
            if (chartInstance) chartInstance.destroy();
            if (total === 0) return;

            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    datasets: [{
                        data: [done, partial, wrong, todo],
                        backgroundColor: ['#10b981', '#f59e0b', '#ef4444', 'rgba(255,255,255,0.07)'],
                        borderWidth: 0, hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false, cutout: '78%',
                    plugins: { legend: { display: false }, tooltip: { enabled: true } }
                }
            });
        }

        function setFilter(level) {
            activeFilter = level;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('filter-' + (level === 'all' ? 'all' : level.toLowerCase())).classList.add('active');
            renderProblemList(getFilteredList());
        }

        function handleSearch() { renderProblemList(getFilteredList()); }

        function handleRandom() {
            const candidates = globalProblems.filter(p =>
                !userSolvedIds.has(p.id) && (activeFilter === 'all' || p.level === activeFilter)
            );
            if (candidates.length === 0) { alert('Không còn bài tập nào phù hợp!'); return; }
            const r = Math.floor(Math.random() * candidates.length);
            window.location.href = `solve.html?id=${candidates[r].id}`;
        }

        // ── Modal ──
        function openModal()  { document.getElementById('modal-add').classList.add('open'); }
        function closeModal() { document.getElementById('modal-add').classList.remove('open'); }
        document.getElementById('modal-add').addEventListener('click', e => { if (e.target === document.getElementById('modal-add')) closeModal(); });

        function saveProblem() {
            const id    = document.getElementById('p-id').value.trim();
            const title = document.getElementById('p-title').value.trim();
            const desc  = document.getElementById('p-desc').value.trim();
            if (!id || !title || !desc) { alert('Vui lòng nhập đủ thông tin bắt buộc!'); return; }
            let testCases = [];
            const testsJson = document.getElementById('p-tests').value;
            try { if (testsJson) testCases = JSON.parse(testsJson); } catch (e) { alert('Lỗi JSON test cases!'); return; }
            db.ref('problems/' + id).set({
                title, description: desc,
                level:        document.getElementById('p-level').value,
                tutorial_vid: document.getElementById('p-vid').value.trim(),
                example_input:  document.getElementById('p-in').value,
                example_output: document.getElementById('p-out').value,
                testcases: testCases,
                author: currentUser.email
            }).then(() => { closeModal(); showSuccess('Đã thêm bài tập thành công!'); })
              .catch(e => alert(e.message));
        }

        // ── Chat ──
        function loadChat() {
            db.ref('global_chat').limitToLast(50).on('child_added', snap => {
                const msg = snap.val();
                const date = msg.timestamp ? new Date(msg.timestamp) : null;
                const timeStr = date
                    ? `${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`
                    : '';
                const roleColor = msg.role === 'teacher' ? 'var(--gold)' : 'var(--accent)';
                const div = document.createElement('div');
                div.className = 'chat-msg';
                div.innerHTML = `
                    <div class="chat-msg-header">
                        <b style="color:${roleColor}">${msg.name || 'Ẩn danh'}</b>
                        <span style="font-size:0.65rem;color:var(--text-muted)">${timeStr}</span>
                    </div>
                    <div style="color:var(--text-secondary);word-break:break-word">${msg.text}</div>`;
                const box = document.getElementById('chat-messages');
                box.appendChild(div);
                box.scrollTop = box.scrollHeight;
            });
        }

        function sendMessage() {
            const txt = document.getElementById('chat-input').value.trim();
            if (!txt || !currentUser) return;
            db.ref('global_chat').push({
                name: currentUser.displayName || currentUser.email,
                text: txt, role: currentUserRole,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });
            document.getElementById('chat-input').value = '';
        }

        function handleEnter(e) { if (e.key === 'Enter') sendMessage(); }

        function toggleChat() {
            const box = document.getElementById('chat-box');
            const tog = document.getElementById('chat-toggle');
            const isHidden = box.style.display !== 'flex';
            box.style.display = isHidden ? 'flex' : 'none';
            tog.style.display = isHidden ? 'none' : 'flex';
            if (isHidden) setTimeout(() => document.getElementById('chat-input').focus(), 100);
        }

        function logout() { auth.signOut().then(() => window.location.href = 'login.html'); }
    </script>
</body>
</html>
