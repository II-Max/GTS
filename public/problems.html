<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO ONLINE JUDGE - Kho Bài Tập</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* --- 1. CORE STYLES --- */
        :root {
            --bg: #05070a;
            --card-bg: rgba(15, 17, 21, 0.85);
            --neon: #00f3ff;
            --pink: #ff0055;
            --green: #0aff60;
            --gold: #ffd700;
            --border: rgba(255, 255, 255, 0.1);
        }
        
        * { box-sizing: border-box; }
        body { 
            background-color: var(--bg); 
            color: #fff; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            padding-bottom: 50px;
            background-image: linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px), 
                              linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px); 
            background-size: 40px 40px;
        }

        /* --- 2. NAVBAR --- */
        .cyber-nav { 
            background: rgba(0, 0, 0, 0.9); 
            border-bottom: 1px solid var(--neon); 
            padding: 0 30px; 
            height: 60px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            position: sticky; top: 0; z-index: 1000; 
            backdrop-filter: blur(10px); 
            font-family: 'JetBrains Mono'; 
        }
        .nav-brand { font-weight: 800; font-size: 1.2rem; color: var(--neon); letter-spacing: 2px; text-shadow: 0 0 10px rgba(0, 243, 255, 0.5); }
        .nav-links { display: flex; gap: 30px; }
        .nav-links a { text-decoration: none; color: #8b9bb4; font-size: 0.9rem; transition: 0.3s; padding: 5px 0; font-weight: 600; }
        .nav-links a:hover, .nav-links a.active { color: #fff; text-shadow: 0 0 8px #fff; }

        .main-content { padding: 30px; max-width: 1200px; margin: 0 auto; }

        /* --- 3. DASHBOARD --- */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            gap: 25px;
            margin-bottom: 40px;
        }

        .dash-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 25px;
            position: relative;
            backdrop-filter: blur(12px);
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .dash-card:hover { border-color: var(--neon); transform: translateY(-3px); }
        .card-profile { border-left: 4px solid var(--neon); }
        .card-stats { border-left: 4px solid var(--gold); }
        .card-chart { border-left: 4px solid var(--green); }

        /* Profile Elements */
        .profile-flex { display: flex; align-items: center; gap: 20px; }
        .user-avatar-big {
            width: 80px; height: 80px;
            border-radius: 50%;
            border: 2px solid var(--neon);
            padding: 3px;
            object-fit: cover;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }
        .user-role { 
            font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; 
            margin-top: 5px; display: inline-block; padding: 4px 10px; border-radius: 4px; font-weight: bold; font-family: 'JetBrains Mono';
        }
        .role-student { background: rgba(0, 132, 255, 0.15); color: #4dabf7; border: 1px solid rgba(0, 132, 255, 0.3); }
        .role-teacher { background: rgba(255, 215, 0, 0.15); color: var(--gold); border: 1px solid rgba(255, 215, 0, 0.3); }
        .btn-logout-mini { margin-top: 10px; background: transparent; border: 1px solid #444; color: #888; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; font-weight: bold; transition: 0.3s; }
        .btn-logout-mini:hover { border-color: var(--pink); color: var(--pink); }

        /* Stats Elements */
        .stats-row { display: flex; justify-content: space-around; text-align: center; height: 100%; align-items: center; }
        .stat-box h1 { margin: 0; font-size: 2.8rem; font-family: 'JetBrains Mono'; font-weight: 800; line-height: 1; margin-bottom: 5px; }
        .text-gradient-gold { background: linear-gradient(45deg, #ffd700, #ffaa00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .text-gradient-rank { background: linear-gradient(45deg, #00f3ff, #0066ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Chart Elements */
        .chart-container { display: flex; align-items: center; justify-content: space-between; height: 100%; }
        .chart-wrapper { width: 100px; height: 100px; position: relative; }
        .chart-legend { display: flex; flex-direction: column; gap: 8px; font-size: 0.8rem; font-family: 'JetBrains Mono'; }
        .legend-item { display: flex; align-items: center; gap: 10px; color: #ccc; }
        .l-dot { width: 8px; height: 8px; border-radius: 2px; }

        /* --- 4. TOOLBAR & LIST --- */
        .toolbar { display: flex; gap: 15px; margin-bottom: 25px; }
        .search-box { flex: 1; position: relative; }
        .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #666; }
        .search-box input { 
            width: 100%; background: rgba(255,255,255,0.05); border: 1px solid #333; color: #fff; 
            padding: 12px 12px 12px 45px; border-radius: 8px; font-family: inherit; font-size: 1rem; outline: none; transition: 0.3s; 
        }
        .search-box input:focus { border-color: var(--neon); background: rgba(0, 243, 255, 0.05); }
        
        .btn-action { border: none; padding: 0 25px; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.3s; font-family: 'JetBrains Mono'; }
        .btn-random { background: linear-gradient(45deg, #ff0055, #ff5e00); color: white; }
        .btn-random:hover { box-shadow: 0 0 20px rgba(255, 0, 85, 0.4); transform: scale(1.02); }
        .btn-add { background: linear-gradient(45deg, #ffd700, #ffaa00); color: #000; display: none; }
        .btn-add:hover { box-shadow: 0 0 20px rgba(255, 215, 0, 0.4); transform: scale(1.02); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { 
            background: #111; border: 1px solid #1f293a; padding: 20px; cursor: pointer; transition: 0.3s; 
            position: relative; border-radius: 12px; font-family: 'JetBrains Mono'; 
        }
        .card:hover { border-color: var(--neon); transform: translateY(-5px); box-shadow: 0 5px 20px rgba(0,243,255,0.1); }
        .tag-id { font-size: 0.75rem; color: #666; border: 1px solid #333; padding: 2px 6px; border-radius: 4px; }
        .prob-title { margin: 12px 0; font-size: 1.1rem; font-weight: bold; }
        .prob-level { font-size: 0.7rem; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; font-weight: bold; }
        .lv-Easy { color: var(--green); background: rgba(10, 255, 96, 0.1); border: 1px solid var(--green); }
        .lv-Medium { color: var(--gold); background: rgba(255, 215, 0, 0.1); border: 1px solid var(--gold); }
        .lv-Hard { color: var(--pink); background: rgba(255, 0, 85, 0.1); border: 1px solid var(--pink); }
        .done-mark { position: absolute; top: 15px; right: 15px; color: var(--green); font-size: 1.2rem; display: none; text-shadow: 0 0 10px var(--green); }

        /* --- 5. MODAL --- */
        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index: 2000; display:none; justify-content:center; align-items:center; backdrop-filter: blur(8px); }
        .modal-box { background: #0f1115; width: 600px; max-width:90%; border: 1px solid var(--gold); padding: 30px; border-radius: 12px; box-shadow: 0 0 50px rgba(255,215,0,0.15); max-height: 90vh; overflow-y: auto; }
        .form-group { margin-bottom: 15px; }
        .form-label { display:block; color: #888; margin-bottom: 8px; font-size: 0.9rem; }
        .form-input, .form-area { width: 100%; background: #1a1e26; border: 1px solid #333; color: white; padding: 12px; border-radius: 6px; font-family: 'JetBrains Mono'; font-size: 0.9rem; }
        .btn-save { width: 100%; background: var(--gold); color: black; border:none; padding: 15px; font-weight:bold; cursor:pointer; margin-top:15px; font-family: 'JetBrains Mono'; border-radius: 6px; transition: 0.3s; }

        /* --- 6. CHAT BOX --- */
        #chat-toggle { position: fixed; bottom: 30px; left: 30px; background: #000; color: var(--neon); border: 1px solid var(--neon); padding: 12px 25px; border-radius: 30px; font-weight: bold; cursor: pointer; z-index: 998; font-family: 'JetBrains Mono'; transition: 0.3s; }
        #chat-toggle:hover { background: var(--neon); color: #000; box-shadow: 0 0 20px var(--neon); }
        #chat-box { position: fixed; bottom: 85px; left: 30px; width: 380px; height: 450px; background: rgba(10, 14, 23, 0.95); border: 1px solid var(--neon); display: none; flex-direction: column; z-index: 999; border-radius: 12px; overflow: hidden; backdrop-filter: blur(10px); }
        .chat-head { padding:15px; background: rgba(0, 243, 255, 0.1); border-bottom:1px solid rgba(0, 243, 255, 0.2); color:var(--neon); font-weight:bold; display:flex; justify-content:space-between; align-items:center; }
        .chat-msgs { flex: 1; padding: 15px; overflow-y: auto; font-size: 0.9rem; color: #ccc; font-family: 'Inter'; }
        .chat-in { display: flex; border-top: 1px solid #333; padding: 10px; background: #000; }
        .chat-in input { flex: 1; background: #111; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 4px; outline: none; margin-right: 10px; }
        .chat-in button { background: var(--neon); color: #000; border: none; padding: 0 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        
        @media (max-width: 900px) {
            .dashboard-grid { grid-template-columns: 1fr; gap: 15px; }
            .stats-row { padding: 20px 0; border-top: 1px solid #333; border-bottom: 1px solid #333; }
        }
    </style>
</head>
<body>

    <nav class="cyber-nav">
        <div class="nav-brand">[ NEO ONLINE JUDGE ]</div>
        <div class="nav-links">
            <a href="problems.html" class="active">KHO BÀI TẬP</a>
            <a href="about.html">★ GIỚI THIỆU</a>
            <a href="documents.html">TÀI LIỆU</a>
            <a href="videos.html">VIDEO</a>
            <a href="contest.html">PHÒNG THI</a>
            <a href="history.html">LỊCH SỬ</a>
            <a href="rank.html">BXH TOP 10</a>
        </div>
    </nav>

    <div class="main-content">
        
        <div class="dashboard-grid">
            <div class="dash-card card-profile">
                <div class="profile-flex">
                    <img id="d-ava" class="user-avatar-big" src="" alt="Avatar">
                    <div class="user-info">
                        <h2 id="d-name">Đang tải...</h2>
                        <span id="role-display" class="user-role role-student">Checking...</span>
                        <div>
                            <button onclick="logout()" class="btn-logout-mini"><i class="fa-solid fa-power-off"></i> Đăng xuất</button>
                        </div>
                    </div>
                </div>
            </div>
        
            <div class="dash-card card-stats">
                <div class="stats-row">
                    <div class="stat-box">
                        <h1 id="d-score" class="text-gradient-gold">0</h1>
                        <span><i class="fa-solid fa-bolt" style="color:var(--gold)"></i> Tổng Điểm</span>
                    </div>
                    <div style="width: 1px; height: 50px; background: rgba(255,255,255,0.1);"></div>
                    <div class="stat-box">
                        <h1 id="d-rank" class="text-gradient-rank">--</h1>
                        <span><i class="fa-solid fa-earth-asia" style="color:var(--neon)"></i> Global Rank</span>
                    </div>
                </div>
            </div>
        
            <div class="dash-card card-chart">
                <div class="chart-container">
                    <div class="chart-wrapper">
                        <canvas id="myChart"></canvas>
                    </div>
                    <div class="chart-legend">
                        <div class="legend-item"><span class="l-dot" style="background: #0aff60"></span> <span>Hoàn thành: <b id="s-done" style="color:#fff">0</b></span></div>
                        <div class="legend-item"><span class="l-dot" style="background: #ffcc00"></span> <span>Chưa xong: <b id="s-partial" style="color:#fff">0</b></span></div>
                        <div class="legend-item"><span class="l-dot" style="background: #ff0055"></span> <span>Sai/Lỗi: <b id="s-wrong" style="color:#fff">0</b></span></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="toolbar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="Tìm kiếm bài tập..." onkeyup="handleSearch()">
            </div>
            <button id="btn-add-prob" class="btn-action btn-add" onclick="openModal()">
                <i class="fa-solid fa-plus-circle"></i> THÊM BÀI
            </button>
            <button class="btn-action btn-random" onclick="handleRandom()">
                <i class="fa-solid fa-dice"></i> RANDOM
            </button>
        </div>

        <div class="grid" id="problem-list">
            <div style="color:#777; font-style:italic">Đang tải dữ liệu từ máy chủ...</div>
        </div>
    </div>

    <div id="modal-add" class="modal-overlay">
        <div class="modal-box">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:1px solid #333; padding-bottom:10px">
                <h2 style="margin:0; color:var(--gold)"><i class="fa-solid fa-pen-to-square"></i> THÊM BÀI TẬP</h2>
                <button onclick="closeModal()" style="background:none; border:none; color:#fff; font-size:1.5rem; cursor:pointer">×</button>
            </div>
            <div style="display:flex; gap:15px">
                <div style="flex:1" class="form-group"><label class="form-label">Mã bài (ID)</label><input type="text" id="p-id" class="form-input" placeholder="VD: bai01"></div>
                <div style="flex:1" class="form-group"><label class="form-label">Độ khó</label><select id="p-level" class="form-input"><option value="Easy">Dễ</option><option value="Medium">Trung Bình</option><option value="Hard">Khó</option></select></div>
            </div>
            <div class="form-group"><label class="form-label">Tên bài tập</label><input type="text" id="p-title" class="form-input"></div>
            <div class="form-group"><label class="form-label">Mô tả đề bài</label><textarea id="p-desc" class="form-area" rows="4"></textarea></div>
            <div class="form-group"><label class="form-label">Youtube ID</label><input type="text" id="p-vid" class="form-input"></div>
            <div style="display:flex; gap:15px">
                <div style="flex:1" class="form-group"><label class="form-label">Ex Input</label><textarea id="p-in" class="form-area" rows="2"></textarea></div>
                <div style="flex:1" class="form-group"><label class="form-label">Ex Output</label><textarea id="p-out" class="form-area" rows="2"></textarea></div>
            </div>
            <div class="form-group"><label class="form-label" style="color:var(--gold)">Test Cases (JSON)</label><textarea id="p-tests" class="form-area" rows="4" placeholder='[{"input": "1 2", "output": "3"}]'></textarea></div>
            <button class="btn-save" onclick="saveProblem()">LƯU BÀI TẬP</button>
        </div>
    </div>

    <button id="chat-toggle" onclick="toggleChat()"><i class="fa-solid fa-comments"></i> CHAT GLOBAL</button>
    <div id="chat-box">
        <div class="chat-head">
            <span><i class="fa-solid fa-earth-americas"></i> KÊNH CHAT CHUNG</span>
            <span style="cursor:pointer" onclick="toggleChat()">✕</span>
        </div>
        <div id="chat-messages" class="chat-msgs"></div>
        <div class="chat-in">
            <input type="text" id="chat-input" placeholder="Nhập tin nhắn..." onkeypress="handleEnter(event)">
            <button onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAQ79PPCmufVgJ312WxRXkFNG4rBb322SU",
            authDomain: "neo-online-judge.firebaseapp.com",
            databaseURL: "https://neo-online-judge-default-rtdb.firebaseio.com",
            projectId: "neo-online-judge",
            storageBucket: "neo-online-judge.firebasestorage.app",
            messagingSenderId: "42094197302",
            appId: "1:42094197302:web:a6e4bf9e06f0cc18077697"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        
        let currentUser = null;
        let currentUserRole = 'student';
        let globalProblems = []; 
        let userSolvedIds = new Set();
        let chartInstance = null;

        auth.onAuthStateChanged((user) => {
            if (!user) window.location.href = "index.html";
            else {
                currentUser = user;
                document.getElementById('d-name').innerText = user.displayName;
                document.getElementById('d-ava').src = user.photoURL || "https://ui-avatars.com/api/?name=" + user.displayName;
                checkAndInitUserRole();
                loadProblems(); 
                loadChat();
            }
        });

        function checkAndInitUserRole() {
            const userRef = db.ref('users/' + currentUser.uid);
            userRef.on('value', snap => {
                const data = snap.val();
                if (!data) {
                    userRef.set({ email: currentUser.email, name: currentUser.displayName, role: 'student' });
                    currentUserRole = 'student';
                } else {
                    currentUserRole = data.role || 'student';
                }
                updateRoleUI(currentUserRole);
            });
        }

        function updateRoleUI(role) {
            const el = document.getElementById('role-display');
            const btnAdd = document.getElementById('btn-add-prob');
            if (role === 'teacher') {
                el.className = 'user-role role-teacher';
                el.innerHTML = '<i class="fa-solid fa-chalkboard-user"></i> GIÁO VIÊN';
                btnAdd.style.display = 'flex';
            } else {
                el.className = 'user-role role-student';
                el.innerHTML = '<i class="fa-solid fa-graduation-cap"></i> HỌC SINH';
                btnAdd.style.display = 'none';
            }
        }

        function loadProblems() {
            db.ref('problems').on('value', snap => {
                const data = snap.val();
                globalProblems = [];
                if(data) {
                    Object.keys(data).forEach(key => {
                        globalProblems.push({ id: key, ...data[key] });
                    });
                }
                calculateStatsAndRender();
            });
        }

        function renderProblemList(list) {
            const div = document.getElementById('problem-list');
            div.innerHTML = "";
            if (list.length === 0) { div.innerHTML = "<p style='color:#777; grid-column: 1/-1; text-align:center'>Không tìm thấy bài tập nào.</p>"; return; }
            list.forEach(bai => {
                const isDone = userSolvedIds.has(bai.id) ? 'block' : 'none';
                div.innerHTML += `
                    <div class="card" onclick="location.href='solve.html?id=${bai.id}'">
                        <div style="display:flex; justify-content:space-between; align-items:start">
                            <span class="tag-id">${bai.id}</span>
                            <span class="prob-level lv-${bai.level}">${bai.level}</span>
                        </div>
                        <div class="prob-title">${bai.title}</div>
                        <div style="font-size:0.8rem; color:#888; overflow:hidden; white-space:nowrap; text-overflow:ellipsis">${bai.description}</div>
                        <div class="done-mark" style="display:${isDone}"><i class="fa-solid fa-circle-check"></i></div>
                    </div>`;
            });
        }

        function calculateStatsAndRender() {
            db.ref('submissions').on('value', snap => {
                const data = snap.val();
                if(!data) { renderProblemList(globalProblems); updateDashboard(0, 0, 0, globalProblems.length); return; }
                
                const allUserScores = {}; 
                Object.values(data).forEach(s => {
                    if(s.status !== 'completed') return;
                    if(!allUserScores[s.uid]) allUserScores[s.uid] = {};
                    const score = parseInt(s.score);
                    if(!allUserScores[s.uid][s.problem_id] || score > allUserScores[s.uid][s.problem_id]) { 
                        allUserScores[s.uid][s.problem_id] = score; 
                    }
                });

                const myScores = allUserScores[currentUser.uid] || {};
                userSolvedIds.clear();
                let cDone = 0, cPartial = 0, cWrong = 0, cTodo = 0, myTotalScore = 0;
                
                globalProblems.forEach(p => {
                    const sc = myScores[p.id];
                    if (sc === undefined) { cTodo++; } 
                    else if (sc === 100) { cDone++; userSolvedIds.add(p.id); myTotalScore += 100; } 
                    else if (sc === 0) { cWrong++; } 
                    else { cPartial++; myTotalScore += sc; }
                });

                updateDashboard(cDone, cPartial, cWrong, cTodo);
                document.getElementById('d-score').innerText = myTotalScore;
                
                const searchVal = document.getElementById('search-input').value;
                if(!searchVal) renderProblemList(globalProblems);

                const rankList = Object.keys(allUserScores).map(uid => {
                    let total = 0; Object.values(allUserScores[uid]).forEach(sc => total += sc); return { uid, total };
                }).sort((a,b) => b.total - a.total);
                
                const me = rankList.find(u => u.uid === currentUser.uid);
                if(me) { document.getElementById('d-rank').innerText = "#" + (rankList.indexOf(me) + 1); }
            });
        }

        function updateDashboard(done, partial, wrong, todo) {
            document.getElementById('s-done').innerText = done;
            document.getElementById('s-partial').innerText = partial;
            document.getElementById('s-wrong').innerText = wrong;

            const ctx = document.getElementById('myChart').getContext('2d');
            if(chartInstance) chartInstance.destroy();

            const total = done + partial + wrong + todo;
            if (total === 0) return;

            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Hoàn thành', 'Chưa xong', 'Sai', 'Chưa làm'],
                    datasets: [{
                        data: [done, partial, wrong, todo],
                        backgroundColor: ['#0aff60', '#ffcc00', '#ff0055', 'rgba(255, 255, 255, 0.1)'],
                        borderWidth: 0, hoverOffset: 5
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false, cutout: '75%',
                    plugins: { legend: { display: false }, tooltip: { enabled: true } }
                }
            });
        }

        function handleSearch() {
            const keyword = document.getElementById('search-input').value.toLowerCase();
            const filtered = globalProblems.filter(p => p.title.toLowerCase().includes(keyword) || p.id.toLowerCase().includes(keyword));
            renderProblemList(filtered);
        }
        function handleRandom() {
            const candidates = globalProblems.filter(p => !userSolvedIds.has(p.id));
            if(candidates.length === 0) { alert("Bạn đã làm hết bài tập!"); }
            else { const r = Math.floor(Math.random() * candidates.length); window.location.href = `solve.html?id=${candidates[r].id}`; }
        }

        // ADD PROBLEM
        function openModal() { document.getElementById('modal-add').style.display = 'flex'; }
        function closeModal() { document.getElementById('modal-add').style.display = 'none'; }
        function saveProblem() {
            const id = document.getElementById('p-id').value.trim();
            const title = document.getElementById('p-title').value.trim();
            const desc = document.getElementById('p-desc').value.trim();
            const vid = document.getElementById('p-vid').value.trim();
            const level = document.getElementById('p-level').value;
            const exIn = document.getElementById('p-in').value;
            const exOut = document.getElementById('p-out').value;
            const testsJson = document.getElementById('p-tests').value;

            if(!id || !title || !desc) return alert("Thiếu thông tin bắt buộc!");
            let testCases = [];
            try { if(testsJson) testCases = JSON.parse(testsJson); } catch(e) { return alert("Lỗi định dạng JSON Testcases!"); }

            db.ref('problems/' + id).set({
                title, description: desc, level, example_input: exIn, example_output: exOut,
                testcases: testCases, tutorial_vid: vid, author: currentUser.email
            }).then(() => { alert("Đã thêm bài!"); closeModal(); }).catch(e => alert(e.message));
        }

        function loadChat() {
            db.ref('global_chat').limitToLast(50).on('child_added', snap => {
                const msg = snap.val();
                
                let timeStr = "";
                if (msg.timestamp) {
                    const date = new Date(msg.timestamp);
                    const hours = String(date.getHours()).padStart(2, '0');
                    const minutes = String(date.getMinutes()).padStart(2, '0');
                    const day = String(date.getDate()).padStart(2, '0');
                    const month = String(date.getMonth() + 1).padStart(2, '0');
                    timeStr = `${hours}:${minutes} ${day}/${month}`;
                }

                const roleText = msg.role === 'teacher' ? 'Giáo Viên' : 'Học Sinh';
                const roleColor = msg.role === 'teacher' ? '#ffd700' : '#0aff60';
                const roleBadge = `<span style="font-size:0.7rem; background:${roleColor}20; color:${roleColor}; padding:1px 4px; border-radius:3px; border:1px solid ${roleColor}40">${roleText}</span>`;
                
                const div = document.createElement('div');
                div.style.marginBottom = "10px"; 
                div.style.fontSize = "0.85rem";
                div.style.lineHeight = "1.4";
                div.style.borderBottom = "1px solid rgba(255,255,255,0.05)";
                div.style.paddingBottom = "5px";

                div.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2px">
                        <div>
                            <b style="color:${roleColor}">${msg.name}</b> 
                            ${roleBadge}
                        </div>
                        <span style="font-size:0.65rem; color:#666">${timeStr}</span>
                    </div>
                    <div style="color:#ddd; word-break: break-word;">${msg.text}</div>
                `;
                
                const box = document.getElementById('chat-messages'); 
                box.appendChild(div); 
                box.scrollTop = box.scrollHeight;
            });
        }

        function sendMessage() {
            const txt = document.getElementById('chat-input').value.trim();
            if(!txt) return;
            db.ref('global_chat').push({ 
                name: currentUser.displayName, 
                text: txt, 
                role: currentUserRole, 
                timestamp: firebase.database.ServerValue.TIMESTAMP 
            });
            document.getElementById('chat-input').value = "";
        }
        function handleEnter(e) { if(e.key==='Enter') sendMessage(); }
        function toggleChat() { 
            const b = document.getElementById('chat-box'); 
            const t = document.getElementById('chat-toggle');
            if(b.style.display === 'none' || !b.style.display) { b.style.display='flex'; t.style.display='none'; setTimeout(() => document.getElementById('chat-input').focus(), 100); } 
            else { b.style.display='none'; t.style.display='block'; } 
        }
        function logout() { auth.signOut().then(()=>window.location.href='index.html'); }
    </script>
</body>
</html>
