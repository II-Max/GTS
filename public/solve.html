<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO Online Judge — Luyện Tập Code</title>
    <meta name="description" content="Giải bài tập lập trình và nhận gợi ý từ AI Mentor.">
    <link rel="stylesheet" href="css/neo-design.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background-image: none; /* No grid in editor mode */
        }

        /* ── HEADER ── */
        .solve-header {
            height: 52px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            flex-shrink: 0;
            gap: 12px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-back {
            display: flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            font-family: var(--font-ui);
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn-back:hover {
            border-color: var(--border-hover);
            color: var(--text-primary);
        }

        .problem-label {
            font-family: var(--font-code);
            font-size: 0.82rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-user {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ── MAIN LAYOUT ── */
        .solve-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ── LEFT PANEL: Problem ── */
        .left-panel {
            width: 42%;
            min-width: 320px;
            border-right: 1px solid var(--border);
            background: var(--bg-surface);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .problem-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
            background: var(--bg-card);
            flex-shrink: 0;
        }

        .problem-tab {
            padding: 11px 14px;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border: none;
            background: none;
            font-family: var(--font-ui);
            position: relative;
            transition: color 0.2s;
        }
        .problem-tab:hover { color: var(--text-secondary); }
        .problem-tab.active { color: var(--accent); }
        .problem-tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px; left: 0; right: 0;
            height: 2px;
            background: var(--accent);
        }

        .problem-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        /* Problem header */
        .problem-header {
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .problem-title-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 8px;
        }

        #problem-title {
            font-family: var(--font-code);
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0;
            line-height: 1.4;
        }

        /* Problem body */
        .problem-section-title {
            font-family: var(--font-code);
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 10px;
        }

        #desc {
            font-size: 0.9rem;
            line-height: 1.7;
            color: var(--text-secondary);
            white-space: pre-wrap;
            margin-bottom: 20px;
        }

        /* IO boxes */
        .io-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        /* Constraints */
        .constraints-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 14px;
            font-size: 0.82rem;
            color: var(--text-secondary);
        }

        /* ── RIGHT PANEL: Editor ── */
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-surface);
            overflow: hidden;
        }

        /* Editor toolbar */
        .editor-toolbar {
            padding: 8px 12px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .lang-select {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            padding: 6px 10px;
            font-family: var(--font-code);
            font-size: 0.82rem;
            cursor: pointer;
            outline: none;
        }
        .lang-select:focus { border-color: var(--accent-border); }

        .editor-spacer { flex: 1; }

        /* Code textarea */
        .code-editor {
            flex: 1;
            background: #0d1117;
            color: #c9d1d9;
            border: none;
            padding: 16px;
            font-family: 'JetBrains Mono', 'Consolas', 'Courier New', monospace;
            font-size: 13.5px;
            resize: none;
            outline: none;
            line-height: 1.6;
            tab-size: 4;
            overflow-y: auto;
        }

        /* Output panel */
        .output-panel {
            height: 160px;
            background: var(--bg-base);
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .output-header {
            padding: 8px 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .output-label {
            font-family: var(--font-code);
            font-size: 0.72rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #output-log {
            flex: 1;
            padding: 12px 14px;
            overflow-y: auto;
            font-family: var(--font-code);
            font-size: 0.82rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* Score badge in output */
        .score-display {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .score-num {
            font-family: var(--font-code);
            font-size: 1.4rem;
            font-weight: 800;
        }

        /* ── AI MODAL ── */
        #ai-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }
        #ai-modal.open { display: flex; }

        .ai-box {
            background: var(--bg-card);
            border: 1px solid var(--ai-border);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 660px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 0 40px rgba(139,92,246,0.2);
            animation: modal-in 0.2s ease;
        }

        @keyframes modal-in {
            from { opacity: 0; transform: scale(0.96) translateY(-12px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        .ai-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ai-title {
            font-family: var(--font-code);
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--ai-purple);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ai-body { padding: 24px; }

        /* AI loading */
        .ai-loading {
            text-align: center;
            padding: 32px 0;
        }

        .ai-progress {
            height: 3px;
            background: var(--bg-elevated);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .ai-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--ai-purple), var(--accent), var(--ai-purple));
            background-size: 200% 100%;
            animation: ai-progress 1.5s linear infinite;
        }
        @keyframes ai-progress { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        .ai-loading-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            animation: blink-ai 1.2s ease-in-out infinite;
        }
        @keyframes blink-ai { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* AI response */
        .ai-response {
            font-size: 0.9rem;
            line-height: 1.7;
            color: var(--text-secondary);
        }
        .ai-response b  { color: var(--ai-purple); font-weight: 700; }
        .ai-response ul { margin-left: 18px; }
        .ai-response li { margin-bottom: 8px; }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="solve-header">
        <div class="header-left">
            <button onclick="window.history.back()" class="btn-back">
                <i class="fa-solid fa-arrow-left"></i> Quay lại
            </button>
            <div class="problem-label">
                <i class="fa-solid fa-code" style="color:var(--accent)"></i>
                <span id="header-problem-id">—</span>
            </div>
        </div>
        <div class="header-user" id="user-info">
            <i class="fa-solid fa-circle-user"></i> Đang tải...
        </div>
    </header>

    <div class="solve-container">

        <!-- LEFT: Problem statement -->
        <div class="left-panel">
            <div class="problem-tabs">
                <button class="problem-tab active" id="tab-desc" onclick="showTab('desc')">Đề bài</button>
                <button class="problem-tab" id="tab-tutorial" onclick="showTab('tutorial')" style="display:none;">
                    <i class="fa-solid fa-video" style="font-size:0.7rem"></i> Video
                </button>
            </div>

            <div class="problem-content" id="panel-desc">
                <!-- Problem header -->
                <div class="problem-header">
                    <div class="problem-title-row">
                        <h1 id="problem-title">Đang tải...</h1>
                        <span id="difficulty-badge" class="badge">—</span>
                    </div>
                </div>

                <!-- Description -->
                <div class="problem-section-title">Mô tả</div>
                <div id="desc">Đang kết nối cơ sở dữ liệu...</div>

                <!-- IO examples -->
                <div class="problem-section-title">Ví dụ</div>
                <div class="io-grid">
                    <div class="code-block">
                        <div class="code-block-header">Input</div>
                        <div id="problem-input" class="code-block-content">...</div>
                    </div>
                    <div class="code-block">
                        <div class="code-block-header">Output</div>
                        <div id="problem-output" class="code-block-content">...</div>
                    </div>
                </div>
            </div>

            <!-- Tutorial panel (hidden) -->
            <div class="problem-content" id="panel-tutorial" style="display:none;">
                <div id="video-container"></div>
            </div>
        </div>

        <!-- RIGHT: Editor -->
        <div class="right-panel">
            <!-- Toolbar -->
            <div class="editor-toolbar">
                <select id="language" class="lang-select">
                    <option value="python">Python</option>
                    <option value="cpp">C++</option>
                    <option value="java">Java</option>
                    <option value="pascal">Pascal</option>
                </select>
                <div class="editor-spacer"></div>
                <button id="btn-ai" class="btn btn-ai btn-sm" onclick="askAI()">
                    <i class="fa-solid fa-robot"></i> AI Gợi Ý
                </button>
                <button class="btn btn-success btn-sm" onclick="submitCode()">
                    <i class="fa-solid fa-play"></i> Chấm bài
                </button>
            </div>

            <!-- Code area -->
            <textarea id="code" class="code-editor" placeholder="// Nhập code của bạn tại đây...
// Chọn ngôn ngữ bên trên và bắt đầu code!"></textarea>

            <!-- Output -->
            <div class="output-panel">
                <div class="output-header">
                    <span class="output-label"><i class="fa-solid fa-terminal"></i> Kết quả chấm bài</span>
                    <span class="output-label" id="output-status"></span>
                </div>
                <div id="output-log">
                    <span style="color:var(--text-muted);">Nhấn "Chấm bài" để chạy code của bạn...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- AI Modal -->
    <div id="ai-modal">
        <div class="ai-box">
            <div class="ai-header">
                <div class="ai-title"><i class="fa-solid fa-robot"></i> AI Mentor Gợi Ý</div>
                <button class="neo-modal-close" onclick="closeAI()">×</button>
            </div>
            <div class="ai-body" id="ai-content">
                <!-- Filled by JS -->
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-auth-check.js"></script>
    <script>
        let currentUser = null;
        let currentProblemId = 'bai1';

        const urlParams  = new URLSearchParams(window.location.search);
        const contestId  = urlParams.get('contest_id');
        const MODE       = contestId ? 'CONTEST' : 'PRACTICE';
        const pid        = urlParams.get('id');
        if (pid) currentProblemId = pid;

        // Hide AI in contest mode
        if (MODE === 'CONTEST') {
            document.getElementById('btn-ai').style.display = 'none';
        }

        // ── Tab switching ──
        function showTab(name) {
            document.querySelectorAll('.problem-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.problem-content').forEach(p => p.style.display = 'none');
            document.getElementById('tab-' + name).classList.add('active');
            document.getElementById('panel-' + name).style.display = 'block';
        }

        // ── Load Problem ──
        function loadProblem() {
            db.ref(`problems/${currentProblemId}`).once('value').then(snap => {
                if (!snap.exists()) {
                    document.getElementById('problem-title').textContent = '⚠️ Không tìm thấy đề bài!';
                    document.getElementById('desc').textContent = 'Vui lòng kiểm tra lại đường dẫn.';
                    return;
                }
                const data = snap.val();
                const contestPrefix = MODE === 'CONTEST'
                    ? '<span class="badge badge-ai" style="font-size:0.7rem">[THI]</span> '
                    : '';

                document.getElementById('header-problem-id').textContent = currentProblemId;
                document.getElementById('problem-title').innerHTML = contestPrefix + (data.title || 'Bài tập');
                document.getElementById('desc').textContent = data.description || '';
                document.getElementById('problem-input').textContent  = data.example_input  || '(Không có)';
                document.getElementById('problem-output').textContent = data.example_output || '(Không có)';

                // Difficulty badge
                const badge = document.getElementById('difficulty-badge');
                const level = data.difficulty || data.level || 'Easy';
                const levelMap = {
                    'Easy': ['badge-easy', 'Dễ'],
                    'Dễ':   ['badge-easy', 'Dễ'],
                    'Medium': ['badge-medium', 'Trung bình'],
                    'Trung Bình': ['badge-medium', 'Trung bình'],
                    'Hard': ['badge-hard', 'Khó'],
                    'Khó': ['badge-hard', 'Khó'],
                };
                const [cls, txt] = levelMap[level] || ['badge-accent', level];
                badge.className = 'badge ' + cls;
                badge.textContent = txt;

                // Tutorial video
                if (data.tutorial_vid) {
                    const tabTut = document.getElementById('tab-tutorial');
                    tabTut.style.display = 'block';
                    document.getElementById('video-container').innerHTML = `
                        <div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:var(--radius-md);">
                            <iframe src="https://www.youtube.com/embed/${data.tutorial_vid}"
                                style="position:absolute;top:0;left:0;width:100%;height:100%;border:none;border-radius:var(--radius-md);"
                                allowfullscreen></iframe>
                        </div>`;
                }

                // Default code templates
                const templates = {
                    python: `# ${data.title}\n\n`,
                    cpp:    `// ${data.title}\n#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    \n    return 0;\n}\n`,
                    java:   `// ${data.title}\nimport java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        \n    }\n}\n`,
                    pascal: `{ ${data.title} }\nprogram Solution;\nbegin\n    \nend.\n`,
                };
                const codeArea = document.getElementById('code');
                if (!codeArea.value.trim()) {
                    codeArea.value = templates[document.getElementById('language').value] || '';
                }
            }).catch(err => {
                console.error('Lỗi tải đề:', err);
                document.getElementById('desc').textContent = 'Lỗi kết nối Firebase.';
            });
        }

        // Update template on language change
        document.getElementById('language').addEventListener('change', function() {
            const templates = {
                python: `# Nhập code Python tại đây\n\n`,
                cpp:    `#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    \n    return 0;\n}\n`,
                java:   `import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        \n    }\n}\n`,
                pascal: `program Solution;\nbegin\n    \nend.\n`,
            };
            const code = document.getElementById('code');
            if (!code.value.trim()) code.value = templates[this.value] || '';
        });

        loadProblem();

        // ── Auth ──
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('user-info').innerHTML =
                    `<i class="fa-solid fa-circle-user"></i> ${user.displayName || user.email}`;
            } else {
                document.getElementById('user-info').innerHTML = 'Chưa đăng nhập';
            }
        });

        // ── Submit Code ──
        function submitCode() {
            if (!currentUser) { alert('Vui lòng đăng nhập để nộp bài!'); return; }
            const code = document.getElementById('code').value;
            const lang = document.getElementById('language').value;
            if (!code.trim()) { alert('Bạn chưa nhập code!'); return; }

            const subId = Date.now().toString();
            const outputLog = document.getElementById('output-log');
            const outputStatus = document.getElementById('output-status');

            outputLog.innerHTML = '<span style="color:var(--warning)">⏳ Đang chấm bài...</span>';
            outputStatus.textContent = 'Đang xử lý';

            let subRef;
            const submitData = {
                uid: currentUser.uid,
                problem_id: currentProblemId,
                code, language: lang,
                status: 'pending',
                timestamp: firebase.database.ServerValue.TIMESTAMP
            };

            if (MODE === 'CONTEST') {
                submitData.contest_id = contestId;
                subRef = db.ref('contest_submissions/' + subId);
            } else {
                subRef = db.ref('submissions/' + subId);
            }

            subRef.set(submitData);

            // Poll for result
            const timeout = setTimeout(() => {
                subRef.off();
                outputLog.innerHTML = '<span style="color:var(--danger)">⚠️ Timeout — Hệ thống chấm chưa phản hồi. Vui lòng thử lại sau.</span>';
                outputStatus.textContent = '';
            }, 30000);

            subRef.on('value', snap => {
                const data = snap.val();
                if (data && data.status === 'completed') {
                    clearTimeout(timeout);
                    subRef.off();

                    const score = data.score;
                    const color = score === 100 ? 'var(--success)' : (score > 0 ? 'var(--warning)' : 'var(--danger)');
                    const icon  = score === 100 ? '✅' : (score > 0 ? '⚡' : '❌');

                    outputStatus.textContent = score === 100 ? 'Accepted' : (score > 0 ? 'Partial' : 'Wrong Answer');

                    outputLog.innerHTML = `
                        <div class="score-display">
                            <span style="font-size:1.2rem">${icon}</span>
                            <span class="score-num" style="color:${color}">${score}/100</span>
                            <span style="font-size:0.8rem;color:var(--text-muted)">điểm</span>
                        </div>
                        <div style="font-size:0.82rem;color:var(--text-secondary);line-height:1.6;">
                            ${(data.message || '').replace(/\n/g, '<br>')}
                        </div>`;
                }
            });
        }

        // ── AI Hint ──
        function askAI() {
            if (MODE === 'CONTEST') { alert('Tính năng AI bị vô hiệu hóa trong phòng thi!'); return; }
            const code = document.getElementById('code').value;
            const desc = document.getElementById('desc').textContent;
            if (!code.trim()) { alert('Bạn chưa viết dòng code nào cả!'); return; }

            const modal   = document.getElementById('ai-modal');
            const content = document.getElementById('ai-content');
            modal.classList.add('open');

            content.innerHTML = `
                <div class="ai-loading">
                    <div class="ai-progress"><div class="ai-progress-bar"></div></div>
                    <div class="ai-loading-text"><i class="fa-solid fa-brain"></i> Mentor đang phân tích code của bạn...</div>
                </div>`;

            const reqId = Date.now().toString();
            const ref   = db.ref('ai_requests/' + reqId);

            ref.set({
                uid: currentUser ? currentUser.uid : 'anonymous',
                name: currentUser ? (currentUser.displayName || currentUser.email) : 'User',
                code, problem_desc: desc,
                status: 'pending',
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });

            const aiTimeout = setTimeout(() => {
                ref.off();
                content.innerHTML = `
                    <div style="text-align:center;padding:20px;">
                        <p style="color:var(--danger);margin-bottom:12px;">⚠️ AI Mentor không phản hồi. Hệ thống AI có thể chưa được khởi động.</p>
                        <button class="btn btn-ghost btn-sm" onclick="closeAI()">Đóng</button>
                    </div>`;
            }, 20000);

            ref.on('value', snap => {
                const data = snap.val();
                if (data && data.status === 'completed') {
                    clearTimeout(aiTimeout);
                    ref.off();
                    let text = data.response || 'Không có phản hồi.';
                    text = text.replace(/\n/g, '<br>');
                    text = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
                    text = text.replace(/^- /gm, '• ');
                    content.innerHTML = `
                        <div class="ai-response">${text}</div>
                        <div style="margin-top:20px;text-align:center;">
                            <button class="btn btn-ghost" onclick="closeAI()">
                                <i class="fa-solid fa-check"></i> Đã hiểu
                            </button>
                        </div>`;
                } else if (data && data.status === 'error') {
                    clearTimeout(aiTimeout);
                    ref.off();
                    content.innerHTML = `
                        <div style="text-align:center;">
                            <p style="color:var(--danger);margin-bottom:12px;">Lỗi: ${data.response || 'Không xác định'}</p>
                            <button class="btn btn-ghost btn-sm" onclick="closeAI()">Đóng</button>
                        </div>`;
                }
            });
        }

        function closeAI() {
            document.getElementById('ai-modal').classList.remove('open');
        }

        // Close AI modal on backdrop click
        document.getElementById('ai-modal').addEventListener('click', e => {
            if (e.target === document.getElementById('ai-modal')) closeAI();
        });

        // Tab key in code editor
        document.getElementById('code').addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = this.selectionStart;
                const end   = this.selectionEnd;
                this.value  = this.value.substring(0, start) + '    ' + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 4;
            }
        });
    </script>
</body>
</html>
